window.EXTRA_META={"x-3-4-sit-up": {"mus": {"p": ["abs"], "s": []}, "steps": ["Lie down on the floor and secure your feet. Your legs should be bent at the knees.", "Place your hands behind or to the side of your head. You will begin with your back on the ground. This will be your starting position.", "Flex your hips and spine to raise your torso toward your knees.", "At the top of the contraction your torso should be perpendicular to the ground. Reverse the motion, going only \u00be of the way down."]}, "x-all-fours-quad-stretch": {"mus": {"p": ["quads"], "s": []}, "steps": ["Start off on your hands and knees, then lift your leg off the floor and hold the foot with your hand.", "Use your hand to hold the foot or ankle, keeping the knee fully flexed, stretching the quadriceps and hip flexors.", "Focus on extending your hips, thrusting them towards the floor. Hold for 10-20 seconds and then switch sides."]}, "x-alternate-hammer-curl": {"mus": {"p": ["biceps"], "s": ["forearms"]}, "steps": ["Stand up with your torso upright and a dumbbell in each hand being held at arms length. The elbows should be close to the torso.", "The palms of the hands should be facing your torso. This will be your starting position.", "While holding the upper arm stationary, curl the right weight forward while contracting the biceps as you breathe out. Continue the movement until your biceps is fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps. Tip: Only the forearms should move.", "Slowly begin to bring the dumbbells back to starting position as your breathe in.", "Repeat the movement with the left hand. This equals one repetition.", "Continue alternating in this manner for the recommended amount of repetitions."]}, "x-alternate-heel-touchers": {"mus": {"p": ["abs"], "s": []}, "steps": ["Lie on the floor with the knees bent and the feet on the floor around 18-24 inches apart. Your arms should be extended by your side. tarting position and repeat on the opposite side."]}, "x-alternating-deltoid-raise": {"mus": {"p": ["delts"], "s": []}, "steps": ["In a standing position, hold a pair of dumbbells at your side.", "Keeping your elbows slightly bent, raise the weights directly in front of you to shoulder height, avoiding any swinging or cheating.", "Return the weights to your side.", "On the next repetition, raise the weights laterally, raising them out to your side to about shoulder height.", "Return the weights to the starting position and continue alternating to the front and side."]}, "x-anti-gravity-press": {"mus": {"p": ["delts"], "s": ["lats", "traps", "triceps"]}, "steps": ["Place a bar on the ground behind the head of an incline bench.", "Lay on the bench face down. With a pronated grip, pick the barbell up from the floor. Flex the elbows, performing a reverse curl to bring the bar near your chest. This will be your starting position.", "To begin, press the barbell out in front of your head by extending your elbows. Keep your arms parallel to the ground throughout the movement.", "Return to the starting position and repeat to complete the set."]}, "x-around-the-worlds": {"mus": {"p": ["chest"], "s": ["delts"]}, "steps": ["Lay down on a flat bench holding a dumbbell in each hand with the palms of the hands facing towards the ceiling. Tip: Your arms should be parallel to the floor and next to your thighs. To avoid injury, make sure that you keep your elbows slightly bent. This will be your starting position.", "Now move the dumbbells by creating a semi-circle as you displace them from the initial position to over the head. All of the movement should happen with the arms parallel to the floor at all times. Breathe in as you perform this portion of the movement.", "Reverse the movement to return the weight to the starting position as you exhale."]}, "x-back-flyes-with-bands": {"mus": {"p": ["delts"], "s": ["lats", "triceps"]}, "steps": ["Run a band around a stationary post like that of a squat rack.", "Grab the band by the handles and stand back so that the tension in the band rises.", "Extend and lift the arms straight in front of you. Tip: Your arms should be straight and parallel to the floor while perpendicular to your torso. Your feet should be firmly planted on the floor spread at shoulder width. This will be your starting position.", "As you exhale, move your arms to the sides and back. Keep your arms extended and parallel to the floor. Continue the movement until the arms are extended to your sides.", "After a pause, go back to the original position as you inhale."]}, "x-band-good-morning": {"mus": {"p": ["hams"], "s": ["glutes", "lowback"]}, "steps": ["Using a 41 inch band, stand on one end, spreading your feet a small amount. Bend at the hips to loop the end of the band behind your neck. This will be your starting position.", "Keeping your legs straight, extend through the hips to come to a near vertical position.", "Ensure that you do not round your back as you go down back to the starting position."]}, "x-band-good-morning-pull-through": {"mus": {"p": ["hams"], "s": ["glutes", "lowback"]}, "steps": ["Loop the band around a post. Standing a little ways away, loop the opposite end around the neck. Your hands can help hold the band in position.", "Begin by bending at the hips, getting your butt back as far as possible. Keep your back flat and bend forward to about 90 degrees. Your knees should be only slightly bent.", "Return to the starting position be driving through with the hips to come back to a standing position."]}, "x-band-hip-adductions": {"mus": {"p": ["adductors"], "s": []}, "steps": ["Anchor a band around a solid post or other object.", "Stand with your left side to the post, and put your right foot through the band, getting it around the ankle.", "Stand up straight and hold onto the post if needed. This will be your starting position.", "Keeping the knee straight, raise your right legs out to the side as far as you can.", "Return to the starting position and repeat for the desired rep count.", "Switch sides."]}, "x-band-skull-crusher": {"mus": {"p": ["triceps"], "s": []}, "steps": ["Secure a band to the base of a rack or the bench. Lay on the bench so that the band is lined up with your head.", "Take hold of the band, raising your elbows so that the upper arm is perpendicular to the floor. With the elbow flexed, the band should be above your head. This will be your starting position.", "Extend through the elbow to straighten your arm, keeping your upper arm in place. Pause at the top of the motion, and return to the starting position."]}, "x-barbell-ab-rollout": {"mus": {"p": ["abs"], "s": ["delts", "lowback"]}, "steps": ["For this exercise you will need to get into a pushup position, but instead of having your hands of the floor, you will be grabbing on to an Olympic barbell (loaded with 5-10 lbs on each side) instead. This will be your starting position.", "While keeping a slight arch on your back, lift your hips and roll the barbell towards your feet as you exhale. Tip: As you perform the movement, your glutes should be coming up, you should be keeping the abs tight and should maintain your back posture at all times. Also your arms should be staying perpendicular to the floor throughout the movement. If you don't, you will work out your shoulders and back more than the abs.", "After a second contraction at the top, start to roll the barbell back forward to the starting position slowly as you inhale."]}, "x-barbell-curl": {"mus": {"p": ["biceps"], "s": ["forearms"]}, "steps": ["Stand up with your torso upright while holding a barbell at a shoulder-width grip. The palm of your hands should be facing forward and the elbows should be close to the torso. This will be your starting position.", "While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.", "Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.", "Slowly begin to bring the bar back to starting position as your breathe in."]}, "x-barbell-curls-lying-against-an-incline": {"mus": {"p": ["biceps"], "s": []}, "steps": ["Lie against an incline bench, with your arms holding a barbell and hanging down in a horizontal line. This will be your starting position.", "While keeping the upper arms stationary, curl the weight up as high as you can while squeezing the biceps. Breathe out as you perform this portion of the movement. Tip: Only the forearms should move. Do not swing the arms.", "After a second contraction, slowly go back to the starting position as you inhale. Tip: Make sure that you go all of the way down."]}, "x-barbell-full-squat": {"mus": {"p": ["quads"], "s": ["calves", "glutes", "hams", "lowback"]}, "steps": ["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack just above shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.", "Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.", "Step away from the rack and position your legs using a shoulder-width medium stance with the toes slightly pointed out. Keep your head up at all times and maintain a straight back. This will be your starting position.", "Begin to slowly lower the bar by bending the knees and sitting back with your hips as you maintain a straight posture with the head up. Continue down until your hamstrings are on your calves. Inhale as you perform this portion of the movement.", "Begin to raise the bar as you exhale by pushing the floor with the heel or middle of your foot as you straighten the legs and extend the hips to go back to the starting position."]}, "x-barbell-glute-bridge": {"mus": {"p": ["glutes"], "s": ["calves", "hams"]}, "steps": ["Begin seated on the ground with a loaded barbell over your legs. Using a fat bar or having a pad on the bar can greatly reduce the discomfort caused by this exercise. Roll the bar so that it is directly above your hips, and lay down flat on the floor.", "Begin the movement by driving through with your heels, extending your hips vertically through the bar. Your weight should be supported by your upper back and the heels of your feet.", "Extend as far as possible, then reverse the motion to return to the starting position."]}, "x-barbell-guillotine-bench-press": {"mus": {"p": ["chest"], "s": ["delts", "triceps"]}, "steps": ["Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over your neck with your arms locked. This will be your starting position.", "As you breathe in, bring the bar down slowly until it is about 1 inch from your neck.", "After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. It should take at least twice as long to go down than to come up.", "Repeat the movement for the prescribed amount of repetitions.", "When you are done, place the bar back in the rack."]}, "x-barbell-hack-squat": {"mus": {"p": ["quads"], "s": ["calves", "forearms", "hams"]}, "steps": ["Stand up straight while holding a barbell behind you at arms length and your feet at shoulder width. Tip: A shoulder width grip is best with the palms of your hands facing back. You can use wrist wraps for this exercise for a better grip. This will be your starting position.", "While keeping your head and eyes up and back straight, squat until your upper thighs are parallel to the floor. Breathe in as you slowly go down.", "Pressing mainly with the heel of the foot and squeezing the thighs, go back up as you breathe out."]}, "x-barbell-incline-bench-press-medium-grip": {"mus": {"p": ["chest"], "s": ["delts", "triceps"]}, "steps": ["Lie back on an incline bench. Using a medium-width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.", "As you breathe in, come down slowly until you feel the bar on you upper chest.", "After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly again. Tip: it should take at least twice as long to go down than to come up.", "Repeat the movement for the prescribed amount of repetitions.", "When you are done, place the bar back in the rack."]}, "x-barbell-incline-shoulder-raise": {"mus": {"p": ["delts"], "s": ["chest"]}, "steps": ["Lie back on an Incline Bench. Using a medium width grip (a grip that is slightly wider than shoulder width), lift the bar from the rack and hold it straight over you with your arms straight. This will be your starting position.", "While keeping the arms straight, lift the bar by protracting your shoulder blades, raising the shoulders from the bench as you breathe out.", "Bring back the bar to the starting position as you breathe in."]}, "x-barbell-lunge": {"mus": {"p": ["quads"], "s": ["calves", "glutes", "hams"]}, "steps": ["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.", "Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.", "Step away from the rack and step forward with your right leg and squat down through your hips, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: Do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. li>", "Using mainly the heel of your foot, push up and go back to the starting position as you exhale.", "Repeat the movement for the recommended amount of repetitions and then perform with the left leg."]}, "x-barbell-rear-delt-row": {"mus": {"p": ["delts"], "s": ["biceps", "lats"]}, "steps": ["Stand up straight while holding a barbell using a wide (higher than shoulder width) and overhand (palms facing your body) grip.", "Bend knees slightly and bend over as you keep the natural arch of your back. Let the arms hang in front of you as they hold the bar. Once your torso is parallel to the floor, flare the elbows out and away from your body. Tip: Your torso and your arms should resemble the letter \"T\". Now you are ready to begin the exercise.", "While keeping the upper arms perpendicular to the torso, pull the barbell up towards your upper chest as you squeeze the rear delts and you breathe out. Tip: When performed correctly, this exercise should resemble a bench press in reverse. Also, refrain from using your biceps to do the work. Focus on targeting the rear delts; the arms should only act as hooks.", "Slowly go back to the initial position as you breathe in."]}, "x-barbell-rollout-from-bench": {"mus": {"p": ["abs"], "s": ["delts", "glutes", "hams", "lats"]}, "steps": ["Place a loaded barbell on the ground, near the end of a bench. Kneel with both legs on the bench, and take a medium to narrow grip on the barbell. This will be your starting position.", "To begin, extend through the hips to slowly roll the bar forward. As you roll out, flex the shoulder to roll the bar above your head. Ensure that your arms remain extended throughout the movement.", "When the bar has been moved as far forward as possible, return to the starting position."]}, "x-barbell-seated-calf-raise": {"mus": {"p": ["calves"], "s": []}, "steps": ["Place a block about 12 inches in front of a flat bench.", "Sit on the bench and place the ball of your feet on the block.", "Have someone place a barbell over your upper thighs about 3 inches above your knees and hold it there. This will be your starting position.", "Raise up on your toes as high as possible as you squeeze the calves and as you breathe out.", "After a second contraction, slowly go back to the starting position. Tip: To get maximum benefit stretch your calves as far as you can."]}, "x-barbell-shoulder-press": {"mus": {"p": ["delts"], "s": ["chest", "triceps"]}, "steps": ["Sit on a bench with back support in a squat rack. Position a barbell at a height that is just above your head. Grab the barbell with a pronated grip (palms facing forward).", "Once you pick up the barbell with the correct grip width, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.", "Lower the bar down to the shoulders slowly as you inhale.", "Lift the bar back up to the starting position as you exhale."]}, "x-barbell-shrug-behind-the-back": {"mus": {"p": ["traps"], "s": ["forearms", "lats"]}, "steps": ["Stand up straight with your feet at shoulder width as you hold a barbell with both hands behind your back using a pronated grip (palms facing back). Tip: Your hands should be a little wider than shoulder width apart. You can use wrist wraps for this exercise for better grip. This will be your starting position.", "Raise your shoulders up as far as you can go as you breathe out and hold the contraction for a second. Tip: Refrain from trying to lift the barbell by using your biceps. The arms should remain stretched out at all times.", "Slowly return to the starting position as you breathe in."]}, "x-barbell-side-bend": {"mus": {"p": ["abs"], "s": ["lowback"]}, "steps": ["Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck). Your feet should be shoulder width apart. This will be your starting position.", "While keeping your back straight and your head up, bend only at the waist to the right as far as possible. Breathe in as you bend to the side. Then hold for a second and come back up to the starting position as you exhale. Tip: Keep the rest of the body stationary.", "Now repeat the movement but bending to the left instead. Hold for a second and come back to the starting position."]}, "x-barbell-side-split-squat": {"mus": {"p": ["quads"], "s": ["calves", "hams", "lowback"]}, "steps": ["Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck). Your feet should be placed wide apart with the foot of the lead leg angled out to the side. This will be your starting position.", "Lower your body towards the side of your angled foot by bending the knee and hip of your lead leg and while keeping the opposite leg only slightly bent. Breathe in as you lower your body.", "Return to the starting position by extending the hip and knee of the lead leg. Breathe out as you perform this movement.", "After performing the recommended amount of reps, repeat the movement with the opposite leg."]}, "x-barbell-squat-to-a-bench": {"mus": {"p": ["quads"], "s": ["calves", "glutes", "hams", "lowback"]}, "steps": ["This exercise is best performed inside a squat rack for safety purposes. To begin, first place a flat bench or a box behind you. The flat bench is used to teach you to set your hips back and to hit depth.", "Then, set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.", "Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.", "Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).", "Begin to slowly lower the bar by bending the knees and sitting your hips back as you maintain a straight posture with the head up. Continue down until you slightly touch the bench behind you. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.", "Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs and extend the hips to go back to the starting position."]}, "x-barbell-step-ups": {"mus": {"p": ["quads"], "s": ["calves", "glutes", "hams"]}, "steps": ["Stand up straight while holding a barbell placed on the back of your shoulders (slightly below the neck) and stand upright behind an elevated platform (such as the one used for spotting behind a flat bench). This is your starting position.", "Place the right foot on the elevated platform. Step on the platform by extending the hip and the knee of your right leg. Use the heel mainly to lift the rest of your body up and place the foot of the left leg on the platform as well. Breathe d, pull your arms straight to your sides.", "Return your arms back to the starting position after a pause at the peak contraction.", "Continue the movement for the prescribed number of repetitions."]}, "x-cable-judo-flip": {"mus": {"p": ["abs"], "s": []}, "steps": ["Connect a rope attachment to a tower, and move the cable to the lowest pulley position. Stand with your side to the cable with a wide stance, and grab the rope with both hands.", "Twist your body away from the pulley as you bring the rope over your shoulder like you're performing a judo flip.", "Shift your weight between your feet as you twist and crunch forward, pulling the cable downward.", "Return to the starting position and repeat until failure.", "Then, reposition and repeat the same series of movements on the opposite side."]}, "x-cable-lying-triceps-extension": {"mus": {"p": ["triceps"], "s": []}, "steps": ["Lie on a flat bench and grasp the straight bar attachment of a low pulley with a narrow overhand grip. Tip: The easiest way to do this is to have someone hand you the bar as you lay down.", "With your arms extended, position the bar over your torso. Your arms and your torso should create a 90-degree angle. This will be your starting position.", "Lower the bar by bending at the elbow while keeping the upper arms stationary and elbows in. Go down until the bar lightly touches your forehead. Breathe in as you perform this portion of the movement.", "Flex the triceps as you lift the bar back to its starting position. Exhale as you perform this portion of the movement.", "Hold for a second at the contracted position and repeat for the recommended amount of repetitions."]}, "x-cable-one-arm-tricep-extension": {"mus": {"p": ["triceps"], "s": []}, "steps": ["With your right hand, grasp a single handle attached to the high-cable pulley using a supinated (underhand; palms facing up) grip. You should be standing directly in front of the weight stack.", "Now pull the handle down so that your upper arm an the starting 90-degree angle. You should still have tension on your abs in the resting position.", "Repeat the same movement to failure."]}, "x-cable-rope-overhead-triceps-extension": {"mus": {"p": ["triceps"], "s": []}, "steps": ["Attach a rope to the bottom pulley of the pulley machine.", "Grasping the rope with both hands, extend your arms with your hands directly above your head using a neutral grip (palms facing each other). Your elbows should be in close to your head and the arms should be perpendicular to the floor with the knuckles aimed at the ceiling. This will be your starting position.", "Slowly lower the rope behind your head as you hold the upper arms stationary. Inhale as you perform this movement and pause when your triceps are fully stretched.", "Return to the starting position by flexing your triceps as you breathe out."]}, "x-cable-rope-rear-delt-rows": {"mus": {"p": ["delts"], "s": ["biceps", "lats"]}, "steps": ["Sit in the same position on a low pulley row station as you would if you were doing seated cable rows for the back.", "Attach a rope to the pulley and grasp it with an overhand grip. Your arms should be extended and parallel to the floor with the elbows flared out.", "Keep your lower back upright and slide your hips back so that your knees are slightly bent. This will be your starting position.", "Pull the cable attachment towards your upper chest, just below the neck, as you keep your elbows up and out to the sides. Continue this motion as you exhale until the elbows travel slightly behind the back. Tip: Keep your upper arms horizontal, perpendicular to the torso and parallel to the floor throughout the motion.", "Go back to the initial position where the arms are extended and the shoulders are stretched forward. Inhale as you perform this portion of the movement."]}, "x-cable-russian-twists": {"mus": {"p": ["abs"], "s": []}, "steps": ["Connect a standard handle attachment, and position the cable to a middle pulley position.", "Lie on a stability ball perpendicular to the cable and grab the handle with one hand. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable.", "Grab the handle with both hands and fully extend your arms above your chest. You hands should be directly in-line with the pulley. If not, adjust the pulley up or down until they are.", "Keep your hips elevated and abs engaged. Rotate your torso away from the pulley for a full-quarter rotation. Your body should be flat from head to knees.", "Pause for a moment and in a slow and controlled manner reset to the starting position. You should still have side tension on the cable in the resting position.", "Repeat the same movement to failure."]}, "x-cable-seated-crunch": {"mus": {"p": ["abs"], "s": []}, "steps": ["Seat on a flat bench with your back facing a high pulley.", "Grasp the cable rope attachment with both hands (with the palms of the hands facing each other) and place your hands securely over both shoulders. Tip: Allow the weight to hyperextend the lower back slightly. This will be your starting position.", "With the hips stationary, flex the waist so the elbows travel toward the hips. Breathe out as you perform this step.", "As you inhale, go back to the initial position slowly."]}, "x-cable-shrugs": {"mus": {"p": ["traps"], "s": []}, "steps": ["Grasp a cable bar attachment that is attached to a low pulley with a shoulder width or slightly wider overhand (palms facing down) grip.", "Stand erect close to the pulley with your arms extended in front of you holding the bar. This will be your starting position.", "Lift the bar by elevating the shoulders as high as possible as you exhale. Hold the contraction at the top for a second. Tip: The arms should remain extended at all times. Refrain from using the biceps to help lift the bar. Only the shoulders should be moving up and down.", "Lower the bar back to the original position."]}, "x-cable-wrist-curl": {"mus": {"p": ["forearms"], "s": []}, "steps": ["Start out by placing a flat bench in front of a low pulley cable that has a straight bar attachment.", "Use your arms to grab the cable bar with a narrow to shoulder width supinated grip (palms up) and bring them up so that your forearms are resting against the top of your thighs. Your wrists should be hanging just beyond your knees.", "Start out by curling your wrist upwards and exhaling. Keep the contraction for a second.", "Slowly lower your wrists back down to the starting position while inhaling.", "Your forearms should be stationary as your wrist is the only movement needed to perform this exercise."]}, "x-calf-raise-on-a-dumbbell": {"mus": {"p": ["calves"], "s": []}, "steps": ["Hang on to a sturdy object for balance and stand on a dumbbell handle, preferably one with round plates so that it rolls as in this manner you have to work harder to stabilize yourself; thus increasing the effectiveness of the exercise.", "Now roll your foot slightly forward so that you can get a nice stretch of the calf. This will be your starting position.", "Lift the calf as you roll your foot over the top of the handle so that you get a full extension. Exhale during the execution of this movement. Contract the calf hard at the top and hold for a second. Tip: As you come up, roll the dumbbell slightly backward.", "Now inhale as you roll the dumbbell slightly forward as you come down to get a better stretch."]}, "x-calf-raises-with-bands": {"mus": {"p": ["calves"], "s": []}, "steps": ["Grab an exercise band and stand on it with your toes making sure that the length of the band between the foot and the arms is the same for both sides.", "While holding the handles of the band, raise the arms to the side of your head as if you were getting ready to perform a shoulder press. The palms should be facing forward with the elbows bent and to the sides. This movement will create tension on the band. This will be your starting position.", "Keeping the hands by your shoulder, stand up on your toes as you exhale and contract the calves hard at the top of the movement.", "After a one second contraction, slowly go back down to the starting position."]}, "x-clean-and-press": {"mus": {"p": ["delts"], "s": ["abs", "calves", "glutes", "hams", "lats", "lowback", "quads", "traps", "triceps"]}, "steps": ["Assume a shoulder-width stance, with knees inside the arms. Now while keeping the back flat, bend at the knees and hips so that you can grab the bar with the arms fully extended and a pronated grip that is slightly wider than shoulder width. Point the elbows out to sides. The bar should be close to the shins. Position the shoulders over or slightly ahead of the bar. Establish a flat back posture. This will be your starting position.", "Begin to pull the bar by extending the knees. Move your hips forward and raise the shoulders at the same rate while keeping the angle of the back constant; continue to lift the bar straight up while keeping it close to your body.", "As the bar passes the knee, extend at the ankles, knees, and hips forcefully, similar to a jumping motion. As you do so, continue to guide the bar with your hands, shrugging your shoulders and using the momentum from your movement to pull the bar as high as possible. The bar should travel close to your body, and you should keep your elbows out.", "At maximum elevation, your feet should clear the floor and you should start to pull yourself under the bar. The mechanics of this could change slightly, depending on the weight used. You should descend into a squatting position as you pull yourself under the bar.", "As the bar hits terminal height, rotate your elbows around and under the bar. Rack the bar across the front of the shoulders while keeping the torso erect and flexing the hips and knees to absorb the weight of the bar.", "Stand to full height, holding the bar in the clean position."]}, "x-clock-push-up": {"mus": {"p": ["chest"], "s": ["delts", "triceps"]}, "steps": ["Move into a prone position on the floor, supporting your weight on your hands and toes.", "Your arms should be fully extended with the hands around shoulder width. Keep your body straight throughout the movement. This will be your starting position.", "Descend by flexing at the elbow, lowering your chest toward the ground.", "At the bottom, reverse the motion by pushing yourself up through elbow extension as quickly as possible until you are air borne. Aim to \"jump\" 12-18 inches to one side.", "As you accelerate up, move your outside foot away from your direction of travel. Leaving the ground, shift your body about 30 degrees for the next repetition.", "Return to the starting position and repeat the exercise, working all the way around until you are back where you started."]}, "x-close-grip-dumbbell-press": {"mus": {"p": ["triceps"], "s": ["chest", "delts"]}, "steps": ["Place a dumbbell standing up on a flat bench.", "Ensuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench with only your shoulders lying on the surface. Hips should be below the bench and your legs bent with your feet firmly on the floor.", "Grasp the dumbbell with both hands and hold it straight over your chest at arm's length. Both palms should be pressing against the underside of the sides of the dumbbell. This will be your starting position.", "Initiate the movement by lowering the dumbbell to your chest.", "Return to the starting position by extending the elbows."]}, "x-close-grip-ez-bar-curl-with-band": {"mus": {"p": ["biceps"], "s": ["forearms"]}, "steps": ["Attach a band to each end of the bar. Take the bar, placing a foot on the middle of the band. Stand upright with a narrow, supinated grip on the EZ bar. The elbows should be close to the torso. This will be your starting position.", "While keeping the upper arms in place, flex the elbows to execute the curl. Exhale as the weight is lifted.", "Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.", "Slowly begin to bring the bar back to starting position as your breathe in."]}, "x-close-grip-ez-bar-press": {"mus": {"p": ["triceps"], "s": ["chest", "delts"]}, "steps": ["Lie on a flat bench with an EZ bar loaded to an appropriate weight.", "Using a narrow grip lift the bar and hold it straight over your torso with your elbows in. The arms should be perpendicular to the floor. This will be your starting position.", "Now lower the bar down to your lower chest as you breathe in. Keep the elbows in as you perform this movement.", "Using the triceps to push the bar back up, press it back to the starting position by extending the elbows as you exhale.", "Repeat."]}, "x-close-grip-ez-bar-curl": {"mus": {"p": ["biceps"], "s": ["forearms"]}, "steps": ["Stand up with your torso upright while holding an E-Z Curl Bar at the closer inner handle. The palm of your hands should be facing forward and they should be slightly tilted inwards due to the shape of the bar. The elbows should be close to the torso. This will be your starting position.", "While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.", "Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.", "Slowly begin to bring the bar back to starting position as your breathe in."]}, "x-close-grip-front-lat-pulldown": {"mus": {"p": ["lats"], "s": ["biceps", "delts"]}, "steps": ["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.", "Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.", "As you have both arms extended in front of you - while holding the bar at the chosen grip width - bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.", "As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary (only the arms should move). The forearms should do no other work except for holding the bar; therefore do not try to pull the bar down using the forearms.", "After a second in the contracted position, while squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.", "6. Repeat this motion for the prescribed amount of repetitions."]}, "x-close-grip-push-up-off-of-a-dumbbell": {"mus": {"p": ["triceps"], "s": ["abs", "chest", "delts"]}, "steps": ["Lie on the floor and place your hands on an upright dumbbell. Supporting your weight on your toes and hands, keep your torso rigid and your elbows in with your arms straight. This will be your starting position.", "Lower your body, allowing the elbows to flex while you inhale. Keep your body straight, not allowing your hips to rise or sag.", "Press yourself back up to the starting position by extending the elbows. Breathe out as you perform this step.", "After a pause at the contracted position, repeat the movement for the prescribed amount of repetitions."]}, "x-close-grip-standing-barbell-curl": {"mus": {"p": ["biceps"], "s": ["forearms"]}, "steps": ["Hold a barbell with both hands, palms up and a few inches apart.", "Stand with your torso straight and your head up. Your feet should be about shoulder width and your elbows close to your torso. This will be your starting position. Tip: You will keep your upper arms and elbows stationary throughout the movement.", "Curl the bar up in a semicircular motion until the forearms touch your biceps. Exhale as you perform this portion of the movement and contract your biceps hard for a second at the top. Tip: Avoid bending the back or using swinging motions as you lift the weight. Only the forearms should move.", "Slowly go back down to the starting position as you inhale."]}, "x-cocoons": {"mus": {"p": ["abs"], "s": []}, "steps": ["Begin by lying on your back on the ground. Your legs should be straight and your arms extended behind your head. This will be your starting position.", "To perform the movement, tuck the knees toward your chest, rotating your pelvis to lift your glutes from the floor. As you do so, flex the spine, bringing your arms back over your head to perform a simultaneous crunch motion.", "After a brief pause, return to the starting position."]}, "x-concentration-curls": {"mus": {"p": ["biceps"], "s": ["forearms"]}, "steps": ["Sit down on a flat bench with one dumbbell in front of you between your legs. Your legs should be spread with your knees bent and feet on the floor.", "Use your right arm to pick the dumbbell up. Place the back of your right upper arm on the top of your inner right thigh. Rotate the palm of your hand until it is facing forward away from your thigh. Tip: Your arm should be extended and the dumbbell should be above the floor. This will be your starting position.", "While holding the upper arm stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Tip: At the top of the movement make sure that the little finger of your arm is higher than your thumb. This guarantees a good contraction. Hold the contracted position for a second as you squeeze the biceps.", "Slowly begin to bring the dumbbells back to starting position as your breathe in. Caution: Avoid swinging motions at any time."]}, "x-cross-body-crunch": {"mus": {"p": ["abs"], "s": []}, "steps": ["Lie flat on your back and bend your knees about 60 degrees.", "Keep your feet flat on the floor and place your hands loosely behind your head. This will be your starting position.", "Now curl up and bring your right elbow and shoulder across your body while bring your left knee in toward your left shoulder at the same time. Reach with your elbow and try to touch your knee. Exhale as you perform this movement. Tip: Try to bring your shoulder up towards your knee rather than just your elbow and remember that the key is to contract the abs as you perform the movement; not just to move the elbow.", "Now go back down to the starting position as you inhale and repeat with the left elbow and the right knee.", "Continue alternating in this manner until all prescribed repetitions are done."]}, "x-cross-body-hammer-curl": {"mus": {"p": ["biceps"], "s": ["forearms"]}, "steps": ["Stand up straight with a dumbbell in each hand. Your hands should be down at your side with your palms facing in.", "While keeping your palms facing in and without twisting your arm, curl the dumbbell of the right arm up towards your left shoulder as you exhale. Touch the top of the dumbbell to your shoulder and hold the contraction for a second.", "Slowly lower the dumbbell along the same path as you inhale and then repeat the same movement for the left arm.", "Continue alternating in this fashion until the recommended amount of repetitions is performed for each arm."]}, "x-cross-over-with-bands": {"mus": {"p": ["chest"], "s": ["biceps", "delts"]}, "steps": ["Secure an exercise band around a stationary post.", "While facing away from the post, grab the handles on both ends of the band and step forward enough to create tension on the band.", "Raise your arms to the sides, parallel to the floor, perpendicular to your torso (your torso and the arms should resemble the letter \"T\") and with the palms facing forward. Have them extended with a slight bend at the elbows. This will be your starting position.", "While keeping your arms straight, bring them across your chest in a semicircular motion to the front as you exhale and flex your pecs. Hold the contraction for a second.", "Slowly return to the starting position as you inhale."]}, "x-crunch-hands-overhead": {"mus": {"p": ["abs"], "s": []}, "steps": ["Lie on the floor with your back flat and knees bent with around a 60-degree angle between the hamstrings and the calves.", "Keep your feet flat on the floor and stretch your arms overhead with your palms crossed. This will be your starting position.", "Curl your upper body forward and bring your shoulder blades just off the floor. At all times, keep your arms aligned with your head, neck and shoulder. Don't move them forward from that position. Exhale as you perform this portion of the movement and hold the contraction for a second.", "Slowly lower down to the starting position as you inhale."]}, "x-crunch-legs-on-exercise-ball": {"mus": {"p": ["abs"], "s": []}, "steps": ["Lie flat on your back with your feet resting on an exercise ball and your knees bent at a 90 degree angle.", "Place your feet three to four inches apart and point your toes inward so they touch.", "Place your hands lightly on either side of your head keeping your elbows in. Tip: Don't lock your fingers behind your head.", "Push the small of your back down in the floor in order to better isolate your abdominal muscles. This will be your starting position.", "Begin to roll your shoulders off the floor and continue to push down as hard as you can with your lower back. Your shoulders should come up off the floor only about four inches, and your lower back should remain on the floor. Breathe out as you execute this portion of the movement. Squeeze your abdominals hard at the top of the contraction and hold for a second. Tip: Focus on a slow, controlled movement. Refrain from using momentum at any time.", "Slowly go back down to the starting position as you inhale."]}, "x-crunches": {"mus": {"p": ["abs"], "s": []}, "steps": ["Lie flat on your back with your feet flat on the ground, or resting on a bench with your knees bent at a 90 degree angle. If you are resting your feet on a bench, place them three to four inches apart and point your toes inward so they touch.", "Now place your hands lightly on either side of your head keeping your elbows in. Tip: Don't lock your fingers behind your head.", "While pushing the small of your back down in the floor to better isolate your abdominal muscles, begin to roll your shoulders off the floor.", "Continue to push down as hard as you can with your lower back as you contract your abdominals and exhale. Your shoulders should come up off the floor only about four inches, and your lower back should remain on the floor. At the top of the movement, contract your abdominals hard and keep the contraction for a second. Tip: Focus on slow, controlled movement - don't cheat yourself by using momentum.", "After the one second contraction, begin to come down slowly again to the starting position as you inhale."]}, "x-cuban-press": {"mus": {"p": ["delts"], "s": ["traps"]}, "steps": ["Take a dumbbell in each hand with a pronated grip in a standing position. Raise your upper arms so that they are parallel to the floor, allowing your lower arms to hang in the \"scarecrow\" position. This will be your starting position.", "To initiate the movement, externally rotate the shoulders to move the upper arm 180 degrees. Keep the upper arms in place, rotating the upper arms until the wrists are directly above the elbows, the forearms perpendicular to the floor.", "Now press the dumbbells by extending at the elbows, straightening your arms overhead.", "Return to the starting position as you breathe in by reversing the steps."]}, "x-deadlift-with-bands": {"mus": {"p": ["lowback"], "s": ["forearms", "glutes", "hams", "lats", "quads", "traps"]}, "steps": ["To deadlift with short bands, simply loop them over the bar before you start, and step into them to set up. For long bands, they will need to be anchored to a secure base, such as heavy dumbbells or a rack.", "With your feet, and your grip set, take a big breath and then lower your hips and bend the knees until your shins contact the bar. Look forward with your head, keep your chest up and your back arched, and begin driving through the heels to move the weight upward. After the bar passes the knees, aggressively pull the bar back, pulling your shoulder blades together as you drive your hips forward into the bar.", "Lower the bar by bending at the hips and guiding it to the floor."]}, "x-deadlift-with-chains": {"mus": {"p": ["lowback"], "s": ["forearms", "glutes", "hams", "lats", "quads", "traps"]}, "steps": ["You can attach the chains to the sleeves of the bar, or just drape the middle over the bar so there is a greater weight increase as you lift.", "Approach the bar so that it is centered over your feet. You feet should be about hip width apart. Bend at the hip to grip the bar at shoulder width, allowing your shoulder blades to protract. Typically, you would use an overhand grip or an over/under grip on heavier sets. With your feet, and your grip set, take a big breath and then lower your hips and bend the knees until your shins contact the bar.", "Look forward with your head, keep your chest up and your back arched, and begin driving through the heels to move the weight upward. After the bar passes the knees, aggressively pull the bar back, pulling your shoulder blades together as you drive your hips forward into the bar.", "Lower the bar by bending at the hips and guiding it to the floor."]}, "x-decline-barbell-bench-press": {"mus": {"p": ["chest"], "s": ["delts", "triceps"]}, "steps": ["Secure your legs at the end of the decline bench and slowly lay down on the bench.", "Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. The arms should be perpendicular to the floor. This will be your starting position. Tip: In order to protect your rotator cuff, it is best if you have a spotter help you lift the barbell off the rack.", "As you breathe in, come down slowly until you feel the bar on your lower chest.", "After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up).", "Repeat the movement for the prescribed amount of repetitions.", "When you are done, place the bar back in the rack."]}, "x-decline-close-grip-bench-to-skull-crushe": {"mus": {"p": ["triceps"], "s": ["chest", "delts"]}, "steps": ["Secure your legs at the end of the decline bench and slowly lay down on the bench.", "Using a close grip (a grip that is slightly less than shoulder width), lift the bar from the rack and hold it straight over you with your arms locked and elbows in. The arms should be perpendicular to the floor. This will be your starting position. Tip: In order to protect your rotator cuff, it is best if you have a spotter help you lift the barbell off the rack.", "Now lower the bar down to your lower chest as you breathe in. Keep the elbows in as you perform this movement.", "Using the triceps to push the bar back up, press it back to the starting position as you exhale.", "As you breathe in and you keep the upper arms
