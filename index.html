y return to the start position."]}, "x-incline-inner-biceps-curl": {"mus": {"p": ["biceps"], "s": []}, "steps": ["Hold a dumbbell in each hand and lie back on an incline bench.", "The dumbbells should be at arm's length hanging at your sides and your palms should be facing out. This will be your starting position.", "Now as you exhale curl the weight outward and up while keeping your forearms in line with your side deltoids. Continue the curl until the dumbbells are at shoulder height and to the sides of your deltoids. Tip: The end of the movement should look similar to a double biceps pose.", "After a second contraction at the top of the movement, start to inhale and slowly lower the weights back to the starting position using the same path used to bring them up."]}, "x-incline-push-up": {"mus": {"p": ["chest"], "s": ["delts", "triceps"]}, "steps": ["Stand facing bench or sturdy elevated platform. Place hands on edge of bench or platform, slightly wider than shoulder width.", "Position forefoot back from bench or platform with arms and body straight. Arms should be perpendicular to body. Keeping body straight, lower chest to edge of box or platform by bending arms.", "Push body up until arms are extended. Repeat."]}, "x-incline-push-up-close-grip": {"mus": {"p": ["triceps"], "s": ["chest", "delts"]}, "steps": ["Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.", "Place your hands next to one another on the bar.", "Position your feet back from the bar with arms and body straight. This will be your starting position.", "Keeping your body straight, lower your chest to the bar by bending the arms.", "Return to the starting position by extending the elbows, pressing yourself back up."]}, "x-incline-push-up-medium": {"mus": {"p": ["chest"], "s": ["abs", "delts", "triceps"]}, "steps": ["Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.", "Place your hands on the bar, with your hands about shoulder width apart.", "Position your feet back from the bar with arms and body straight. This will be your starting position.", "Keeping your body straight, lower your chest to the bar by bending the arms.", "Return to the starting position by extending the elbows, pressing yourself back up."]}, "x-incline-push-up-reverse-grip": {"mus": {"p": ["chest"], "s": ["abs", "delts", "triceps"]}, "steps": ["Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.", "Place your hands on the bar palms up, with your hands about shoulder width apart.", "Position your feet back from the bar with arms and body straight. This will be your starting position.", "Keeping your body straight, lower your chest to the bar by bending the arms.", "Return to the starting position by extending the elbows, pressing yourself back up."]}, "x-incline-push-up-wide": {"mus": {"p": ["chest"], "s": ["abs", "delts", "triceps"]}, "steps": ["Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height.", "Place your hands on the bar, with your hands wider than shoulder width.", "Position your feet back from the bar with arms and body straight. Your arms should be perpendicular to the body. This will be your starting position.", "Keeping your body straight, lower your chest to the bar by bending the arms.", "Return to the starting position by extending the elbows, pressing yourself back up."]}, "x-internal-rotation-with-band": {"mus": {"p": ["delts"], "s": []}, "steps": ["Choke the band around a post. The band should be at the same height as your elbow. Stand with your right side to the band a couple of feet away.", "Grasp the end of the band with your right hand, and keep your elbow pressed firmly to your side. We recommend you hold a pad or foam roll in place with your elbow to keep it firmly in position.", "With your upper arm in position, your elbow should be flexed to 90 degrees with your hand reaching away from your torso. This will be your starting position.", "Execute the movement by rotating your arm in a forehand motion, keeping your elbow in place.", "Continue as far as you are able, pause, and then return to the starting position."]}, "x-iron-cross": {"mus": {"p": ["delts"], "s": ["chest", "glutes", "hams", "lowback", "quads", "traps"]}}, "x-isometric-chest-squeezes": {"mus": {"p": ["chest"], "s": ["delts", "triceps"]}, "steps": ["While either seating or standing, bend your arms at a 90-degree angle and place the palms of your hands together in front of your chest. Tip: Your hands should be open with the palms together and fingers facing forward (perpendicular to your torso).", "Push both hands against each other as you contract your chest. Start with slow tension and increase slowly. Keep breathing normally as you execute this contraction.", "Hold for the recommended number of seconds.", "Now release the tension slowly.", "Rest for the recommended amount of time and repeat."]}, "x-isometric-neck-exercise-front-and-back": {"mus": {"p": ["neck"], "s": []}, "steps": ["With your head and neck in a neutral position (normal position with head erect facing forward), place both of your hands on the front side of your head.", "Now gently push forward as you contract the neck muscles but resisting any movement of your head. Start with slow tension and increase slowly. Keep breathing normally as you execute this contraction.", "Hold for the recommended number of seconds.", "Now release the tension slowly.", "Rest for the recommended amount of time and repeat with your hands placed on the back side of your head."]}, "x-isometric-neck-exercise-sides": {"mus": {"p": ["neck"], "s": []}, "steps": ["With your head and neck in a neutral position (normal position with head erect facing forward), place your left hand on the left side of your head.", "Now gently push towards the left as you contract the left neck muscles but resisting any movement of your head. Start with slow tension and increase slowly. Keep breathing normally as you execute this contraction.", "Hold for the recommended number of seconds.", "Now release the tension slowly.", "Rest for the recommended amount of time and repeat with your right hand placed on the right side of your head."]}, "x-isometric-wipers": {"mus": {"p": ["chest"], "s": ["abs", "delts", "triceps"]}, "steps": ["Assume a push-up position, supporting your weight on your hands and toes while keeping your body straight. Your hands should be just outside of shoulder width. This will be your starting position.", "Begin by shifting your body weight as far to one side as possible, allowing the elbow on that side to flex as you lower your body.", "Reverse the motion by extending the flexed arm, pushing yourself up and then dropping to the other side.", "Repeat for the desired number of repetitions."]}, "x-jm-press": {"mus": {"p": ["triceps"], "s": ["chest", "delts"]}, "steps": ["Start the exercise the same way you would a close grip bench press. You will lie on a flat bench while holding a barbell at arms length (fully extended) with the elbows in. However, instead of having the arms perpendicular to the torso, make sure the bar is set in a direct line above the upper chest. This will be your starting position.", "Now beginning from a fully extended position lower the bar down as if performing a lying triceps extension. Inhale as you perform this movement. When you reach the half way point, let the bar roll back about one inch by moving the upper arms towards your legs until they are perpendicular to the torso. Tip: Keep the bend at the elbows constant as you bring the upper arms forward.", "As you exhale, press the bar back up by using the triceps to perform a close grip bench press.", "Now go back to the starting position and start over."]}, "x-jackknife-sit-up": {"mus": {"p": ["abs"], "s": []}, "steps": ["Lie flat on the floor (or exercise mat) on your back with your arms extended straight back behind your head and your legs extended also. This will be your starting position.", "As you exhale, bend at the waist while simultaneously raising your legs and arms to meet in a jackknife position. Tip: The legs should be extended and lifted at approximately a 35-45 degree angle from the floor and the arms should be extended and parallel to your legs. The upper torso should be off the floor.", "While inhaling, lower your arms and legs back to the starting position."]}, "x-janda-sit-up": {"mus": {"p": ["abs"], "s": []}, "steps": ["Position your body on the floor in the basic sit-up position; knees to a ninety degree angle with feet flat on the floor and arms either crossed over your chest or to the sides. This will be your starting position.", "As you strongly tighten your glutes and hamstrings, fill your lungs with air and in a slow (three to six second count) ascent, slowly exhale. Tip: It is important to tighten the glutes and hamstrings as this will cause the hip flexors to be inactivated in a process called reciprocal inhibition, which basically means that opposite muscles to the contracted ones will relax.", "As you inhale, slowly go back in a controlled manner to the starting position."]}, "x-jefferson-squats": {"mus": {"p": ["quads"], "s": ["calves", "glutes", "hams", "lowback", "traps"]}, "steps": ["Place a barbell on the floor.", "Stand in the middle of the bar length wise.", "Bend down by bending at the knees and keeping your back straight and grasp the front of the bar with your right hand. Your palm should be in (neutral grip) facing the left side.", "Grasp the rear of the bar with your left hand. The palm of your hand should be in neutral grip alignment (palms facing the right side). Tip: Ensure that your grip is even on the bar. Your torso should be positioned right in the middle of the bar and the distance between your torso and your right hand (which should be at the front) should be the same as the distance between your torso and your left hand (which should be to your back).", "Now stand straight up with the weight. Tip: Your feet should be shoulder width apart and your toes slightly pointed out.", "Squat down by bending at the knees and keeping your back straight until your upper thighs are parallel with the floor. Tip: Keep your back as vertical as possible with the floor and your head up. Also remember to not let your knees go past your toes. Inhale during this portion of the movement."]}, "x-knee-circles": {"mus": {"p": ["calves"], "s": ["hams", "quads"]}, "steps": ["Stand with your legs together and hands by your waist.", "Now move your knees in a circular motion as you breathe normally."]}, "x-knee-tuck-jump": {"mus": {"p": ["hams"], "s": ["adductors", "calves", "glutes", "quads"]}, "steps": ["Begin in a comfortable standing position with your knees slightly bent. Hold your hands in front of you, palms down with your fingertips together at chest height. This will be your starting position.", "Rapidly dip down into a quarter squat and immediately explode upward. Drive the knees towards the chest, attempting to touch them to the palms of the hands.", "Jump as high as you can, raising your knees up, and then ensure a good land be re-extending your legs, absorbing impact through be allowing the knees to rebend."]}, "x-kneeling-cable-crunch-with-alternating-o": {"mus": {"p": ["abs"], "s": []}, "steps": ["Connect a rope attachment to a high pulley cable and position a mat on the floor in front of it.", "Grab the rope with both hands and kneel approximately two feet back from the tower.", "Position the rope behind your head with your hands by your ears.", "Keep your hands in the same place, contract your abs and pull downward on the rope in a crunching movement until your elbows reach your knees.", "Pause briefly at the bottom and rise up in a slow and controlled manner until you reach the starting position.", "Repeat the same downward movement until you're halfway down, at which time you'll begin rotating one of your elbows to the opposite knee."]}, "x-kneeling-cable-triceps-extension": {"mus": {"p": ["triceps"], "s": []}, "steps": ["Place a bench sideways in front of a high pulley machine.", "Hold a straight bar attachment above your head with your hands about 6 inches apart with your palms facing down.", "Face away from the machine and kneel.", "Place your head and the back of your upper arms on the bench. Your elbows should be bent with the forearms pointing towards the high pulley. This will be your starting position.", "While keeping your upper arms close to your head at all times with the elbows in, press the bar out in a semicircular motion until the elbows are locked and your arms are parallel to the floor. Contract the triceps hard and keep this position for a second. Exhale as you perform this movement.", "Slowly return to the starting position as you breathe in."]}, "x-kneeling-high-pulley-row": {"mus": {"p": ["lats"], "s": ["biceps"]}, "steps": ["Select the appropriate weight using a pulley that is above your head. Attach a rope to the cable and kneel a couple of feet away, holding the rope out in front of you with both arms extended. This will be your starting position.", "Initiate the movement by flexing the elbows and fully retracting your shoulders, pulling the rope toward your upper chest with your elbows out.", "After pausing briefly, slowly return to the starting position."]}, "x-kneeling-single-arm-high-pulley-row": {"mus": {"p": ["lats"], "s": ["biceps"]}, "steps": ["Attach a single handle to a high pulley and make your weight selection.", "Kneel in front of the cable tower, taking the cable with one hand with your arm extended. This will be your starting position.", "Starting with your palm facing forward, pull the weight down to your torso by flexing the elbow and retract the shoulder blade. As you do so, rotate the wrist so that at the completion of the movement, your palm is now facing you.", "After a brief pause, return to the starting position."]}, "x-kneeling-squat": {"mus": {"p": ["glutes"], "s": ["abs", "hams", "lowback"]}, "steps": ["Set the bar to the proper height in a power rack. Kneel behind the bar; it may be beneficial to put a mat down to pad your knees. Slide under the bar, racking it across the back of your shoulders. Your shoulder blades should be retracted and the bar tight across your back. Unrack the weight.", "With your head looking forward, sit back with your butt until you touch your calves.", "Reverse the motion, returning the torso to an upright position."]}, "x-landmine-180-s": {"mus": {"p": ["abs"], "s": ["delts", "glutes", "lowback"]}, "steps": ["Position a bar into a landmine or securely anchor it in a corner. Load the bar to an appropriate weight.", "Raise the bar from the floor, taking it to shoulder height with both hands with your arms extended in front of you. Adopt a wide stance. This will be your starting position.", "Perform the movement by rotating the trunk and hips as you swing the weight all the way down to one side. Keep your arms extended throughout the exercise.", "Reverse the motion to swing the weight all the way to the opposite side.", "Continue alternating the movement until the set is complete."]}, "x-landmine-linear-jammer": {"mus": {"p": ["delts"], "s": ["abs", "calves", "chest", "hams", "quads", "triceps"]}, "steps": ["Position a bar into landmine or, lacking one, securely anchor it in a corner. Load the bar to an appropriate weight and position the handle attachment on the bar.", "Raise the bar from the floor, taking the handles to your shoulders. This will be your starting position.", "In an athletic stance, squat by flexing your hips and setting your hips back, keeping your arms flexed.", "Reverse the motion by powerfully extending through the hips, knees, and ankles, while also extending the elbows to straighten the arms. This movement should be done explosively, coming out of the squat to full extension as powerfully as possible.", "Return to the starting position."]}, "x-lateral-bound": {"mus": {"p": ["adductors"], "s": ["calves", "glutes", "hams", "quads"]}, "steps": ["Assume a half squat position facing 90 degrees from your direction of travel. This will be your starting position.", "Allow your lead leg to do a countermovement inward as you shift your weight to the outside leg.", "Immediately push off and extend, attempting to bound to the side as far as possible.", "Upon landing, immediately push off in the opposite direction, returning to your original start position.", "Continue back and forth for several repetitions."]}, "x-leg-lift": {"mus": {"p": ["glutes"], "s": ["hams"]}, "steps": ["While standing up straight with both feet next to each other at around shoulder width, grab a sturdy surface such as the sides of a squat rack or the top of a chair to brace yourself and keep balance.", "With or without an ankle weight, lift one leg behind you as if performing a leg curl but standing up while keeping the other leg straight. Breathe out as you perform this movement.", "Slowly bring the raised leg back to the floor as you breathe in.", "Repeat the movement with the opposite leg."]}, "x-leg-pull-in": {"mus": {"p": ["abs"], "s": []}, "steps": ["Lie on an exercise mat with your legs extended and your hands either palms facing down next to you or under your glutes. Tip: My preference is with the hands next to me. This will be your starting position.", "Bend your knees and pull your upper thighs into your midsection as you breathe out. Continue the motion until your knees are around chest level. Contract your abs as you execute this movement and hold for a second at the top. Tip: As you perform the motion, the lower legs (calves) should always remain parallel to the floor.", "Return to the starting position as you inhale."]}, "x-low-cable-triceps-extension": {"mus": {"p": ["triceps"], "s": []}, "steps": ["Select the desired weight and lay down face up on the bench of a seated row machine that has a rope attached to it. Your head should be pointing towards the attachment.", "Grab the outside of the rope ends with your palms facing each other (neutral grip).", "Position your elbows so that they are bent at a 90 degree angle and your upper arms are perpendicular (90 degree angle) to your torso. Tip: Keep the elbows in and make sure that the upper arms point to the ceiling while your forearms point towards the pulley above your head. This will be your starting position.", "As you breathe out, extend your lower arms until they are straight and vertical. The upper arms and elbows remain stationary throughout the movement. Only the forearms should move. Contract the triceps hard for a second.", "As you breathe in slowly return to the starting position."]}, "x-low-pulley-row-to-neck": {"mus": {"p": ["delts"], "s": ["biceps", "lats", "traps"]}, "steps": ["Sit on a low pulley row machine with a rope attachment.", "Grab the ends of the rope using a palms-down grip and sit with your back straight and your knees slightly bent. Tip: Keep your back almost completely vertical and your arms fully extended in front of you. This will be your starting position.", "While keeping your torso stationary, lift your elbows and start bending them as you pull the rope towards your neck while exhaling. Throughout the movement your upper arms should remain parallel to the floor. Tip: Continue this motion until your hands are almost next to your ears (the forearms will not be parallel to the floor at the end of the movement as they will be angled a bit upwards) and your elbows are out away from your sides.", "After holding for a second or so at the contracted position, come back slowly to the starting position as you inhale. Tip: Again, during no part of the movement should the torso move."]}, "x-lower-back-curl": {"mus": {"p": ["abs"], "s": []}, "steps": ["Lie on your stomach with your arms out to your sides. This will be your starting position.", "Using your lower back muscles, extend your spine lifting your chest off of the ground. Do not use your arms to push yourself up. Keep your head up during the movement. Repeat for 10-20 repetitions."]}, "x-lying-cable-curl": {"mus": {"p": ["biceps"], "s": []}, "steps": ["Grab a straight bar or E-Z bar attachment that is attached to the low pulley with both hands, using an underhand (palms facing up) shoulder-width grip.", "Lie flat on your back on top of an exercise mat in front of the weight stack with your feet flat against the frame of the pulley machine and your legs straight.", "With your arms extended and your elbows close to your body slightly bend your arms. This will be your starting position.", "While keeping your upper arms stationary and the elbows close to your body, curl the bar up slowly toward your chest as you breathe out and you squeeze the biceps.", "After a second squeeze at the top of the movement, slowly return to the starting position."]}, "x-lying-cambered-barbell-row": {"mus": {"p": ["lats"], "s": ["biceps", "traps"]}, "steps": ["Place a cambered bar underneath an exercise bench.", "Lie face down on the exercise bench and grab the bar using a palms down (pronated grip) that is wider than shoulder width. This will be your starting position.", "As you exhale row the bar up as you keep the elbows close to your body to either your chest, in order to target the upper mid back, or to your stomach if targeting the lats is your goal.", "After a second hold at the top, lower back down to the starting position slowly as you inhale."]}, "x-lying-close-grip-bar-curl-on-high-pulley": {"mus": {"p": ["biceps"], "s": []}, "steps": ["Place a flat bench in front of a high pulley or lat pulldown machine.", "Hold the straight bar attachment using an underhand grip (palms up) that is about shoulder width.", "Lie on your back with your head over the end of the bench.", "Now extend your arms straight above your shoulders. Your torso and your arms should make a 90-degree angle and the elbows should be in. This will be your starting position.", "As you breathe out, curl the bar down in a semicircular motion until it touches your chin. Squeeze the biceps for a second at the top contracted position. Tip: As you execute this motion only the forearms should move. At no time should the upper arms be moving at all. They are to remain perpendicular throughout the movement.", "Return to starting position slowly."]}, "x-lying-close-grip-barbell-triceps-extensi": {"mus": {"p": ["triceps"], "s": []}, "steps": ["While holding a barbell or EZ Curl bar with a pronated grip (palms facing forward), lie on your back on a flat bench with your head close to the end of the bench. Tip: If you are holding a barbell grab it using a shoulder-width grip and if you are using an E-Z Bar grab it on the inner handles.", "Extend your arms in front of you and slowly bring the bar back in a semi circular motion (while keeping the arms extended) to a position over your head. At the end of this step your arms should be overhead and parallel to the floor. This will be your starting position. Tip: Keep your elbows in at all times.", "As you inhale, lower the bar by bending at the elbows and while keeping the upper arm stationary. Keep lowering the bar until your forearms are perpendicular to the floor.", "As you exhale bring the bar back up to the starting position by pushing the bar up in a semi-circular motion until the lower arms are also parallel to the floor. Contract the triceps hard at the top of the movement for a second. Tip: Again, only the forearms should move. The upper arms should remain stationary at all times."]}, "x-lying-close-grip-barbell-triceps-press-t": {"mus": {"p": ["triceps"], "s": []}, "steps": ["While holding a barbell or EZ Curl bar with a pronated grip (palms facing forward), lie on your back on a flat bench with your head off the end of the bench. Tip: If you are holding a barbell grab it using a shoulder-width grip and if you are using an E-Z Bar grab it on the inner handles.", "Extend your arms in front of you as you hold the barbell over your chest. The arms should be perpendicular to your torso (90-degree angle). This will be your starting position.", "As you inhale, lower the bar in a semi-circular motion by bending at the elbows and while keeping the upper arm stationary and elbows in. Keep lowering the bar until it lightly touches your chin.", "As you exhale bring the bar back up to the starting position by pushing the bar up in a semi-circular motion. Contract the triceps hard at the top of the movement for a second. Tip: Again, only the forearms should move. The upper arms should remain stationary at all times."]}, "x-lying-crossover": {"mus": {"p": ["glutes"], "s": []}, "steps": ["Lie on your back with your legs extended.", "Cross one leg over your body with the knee bent, attempting to touch the knee to the ground. Your partner should kneel beside you, holding your shoulder down with one hand and controlling the crossed leg with the other. this will be your starting position.", "Attempt to raise the bent knee off of the ground as your partner prevents any actual movement.", "After 10-20 seconds, relax the leg as your partner gently presses the knee towards the floor. Repeat with the other side."]}, "x-lying-dumbbell-tricep-extension": {"mus": {"p": ["triceps"], "s": ["chest", "delts"]}, "steps": ["Lie on a flat bench while holding two dumbbells directly in front of you. Your arms should be fully extended at a 90-degree angle from your torso and the floor. The palms should be facing in and the elbows should be tucked in. This is the starting position.", "As you breathe in and you keep the upper arms stationary with the elbows in, slowly lower the weight until the dumbbells are near your ears.", "At that point, while keeping the elbows in and the upper arms stationary, use the triceps to bring the weight back up to the starting position as you breathe out."]}, "x-lying-glute": {"mus": {"p": ["glutes"], "s": []}, "steps": ["Lie on your back with your partner kneeling beside you.", "Flex the hip of one leg, raising it off of the floor. Rotate the leg so the foot is over the opposite hip, the lower leg perpendicular to your body. Your partner should hold the knee and ankle in place. This will be your starting position.", "Attempt to push your leg towards your partner, who should be preventing any actual movement of the leg.", "After 10-20 seconds, completely relax as your partner gently pushes the ankle and knee towards your chest. Be sure to inform your helper when the stretch is adequate to prevent injury or overstretching."]}, "x-lying-high-bench-barbell-curl": {"mus": {"p": ["biceps"], "s": []}, "steps": ["Lie face forward on a tall flat bench while holding a barbell with a supinated grip (palms facing up). Tip: If you are holding a barbell grab it using a shoulder-width grip and if you are using an E-Z Bar grab it on the inner handles. Your upper body should be positioned in a way that the upper chest is over the end of the bench and the barbell is hanging in front of you with the arms extended and perpendicular to the floor. This will be your starting position.", "While keeping the elbows in and the upper arms stationary, curl the weight up in a semi-circular motion as you contract the biceps and exhale. Hold at the top of the movement for a second.", "As you inhale, slowly go back to the starting position. Tip: Maintain full control of the weight at all times and avoid any swinging. Remember, only the forearms should move throughout the movement."]}, "x-lying-one-arm-lateral-raise": {"mus": {"p": ["delts"], "s": []}, "steps": ["While holding a dumbbell in one hand, lay with your chest down on a flat bench. The other hand can be used to hold to the leg of the bench for stability.", "Position the palm of the hand that is holding the dumbbell in a neutral manner (palms facing your torso) as you keep the arm extended with the elbow slightly bent. This will be your starting position.", "Now raise the arm with the dumbbell to the side until your elbow is at shoulder height and your arm is roughly parallel to the floor as you exhale. Tip: Maintain your arm perpendicular to the torso while keeping your arm extended throughout the movement. Also, keep the contraction at the top for a second.", "Slowly lower the dumbbell to the starting position as you inhale."]}, "x-lying-prone-quadriceps": {"mus": {"p": ["quads"], "s": []}, "steps": ["Lay face down on the floor with your partner kneeling beside you. Flex one knee and raise that leg off the ground, attempting to touch your glutes with your foot. Your partner should hold the knee and ankle. This will be your starting position.", "Attempt to extend your knee while your partner prevents any actual movement.", "After 10-20 seconds, relax your muscles as your partner gently pushes the foot towards your glutes, further stretching the quadriceps and hip flexors.", "After 10-20 seconds, switch sides."]}, "x-lying-rear-delt-raise": {"mus": {"p": ["delts"], "s": []}, "steps": ["While holding a dumbbell in each hand, lay with your chest down on a flat bench.", "Position the palms of the hands in a neutral manner (palms facing your torso) as you keep the arms extended with the elbows slightly bent. This will be your starting position.", "Now raise the arms to the side until your elbows are at shoulder height and your arms are roughly parallel to the floor as you exhale. Tip: Maintain your arms perpendicular to the torso while keeping them extended throughout the movement. Also, keep the contraction at the top for a second.", "Slowly lower the dumbbells to the starting position as you inhale."]}, "x-lying-supine-dumbbell-curl": {"mus": {"p": ["biceps"], "s": []}, "steps": ["Lie down on a flat bench face up while holding a dumbbell in each arm on top of your thighs.", "Bring the dumbbells to the sides with the arms extended and the palms of the hands facing your thighs (neutral grip).", "While keeping the arms close to your torso and elbows in, slowly lower your arms (as you keep them extended with a slight bend at the elbows) as far down towards the floor as you can go. Once you cannot go down any further, lock your upper arms in that position and that will be your starting position.", "As you breathe out, slowly begin to curl the weights up as you simultaneously rotate your wrists so that the palms of the hands face up. Continue curling the weight until your biceps are fully contracted and squeeze hard at the top position for a second. Tip: Only the forearms should move. Upper arms should remain stationary and elbows should stay in throughout the movement.", "Return back to the starting position very slowly."]}, "x-middle-back-shrug": {"mus": {"p": ["lats"], "s": []}, "steps": ["Lie facedown on an incline bench while holding a dumbbell in each hand. Your arms should be fully extended hanging down and pointing towards the floor. The palms of your hands should be facing each other. This will be your starting position.", "As you exhale, squeeze your shoulder blades together and hold the contraction for a full second. Tip: This movement is just like the reverse action of a hug, or trying to perform rear laterals as if you had no arms.", "As you inhale go back to the starting position."]}, "x-narrow-stance-squats": {"mus": {"p": ["quads"], "s": ["calves", "glutes", "hams", "lowback"]}, "steps": ["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.", "Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.", "Step away from the rack and position your legs using a less-than-shoulder-width narrow stance with the toes slightly pointed out. Feet should be around 3-6 inches apart. Keep your head up at all times (looking down will om each other holding your torso up at arms length.", "Place your toes on top of a flat bench. This will allow your body to be elevated. Note: The higher the elevation of the flat bench, the higher the resistance of the exercise is.", "Lower yourself until your chest almost touches the floor as you inhale.", "Using your pectoral muscles, press your upper body back up to the starting position and squeeze your chest. Breathe out as you perform this step.", "After a second pause at the contracted position, repeat the movement for the prescribed amount of repetitions."]}, "x-push-up-to-side-plank": {"mus": {"p": ["chest"], "s": ["abs", "delts", "triceps"]}, "steps": ["Get into pushup position on the toes with your hands just outside of shoulder width.", "Perform a pushup by allowing the elbows to flex. As you descend, keep your body straight.", "Do one pushup and as you come up, shift your weight on the left side of the body, twist to the side while bringing the right arm up towards the ceiling in a side plank.", "Lower the arm back to the floor for another pushup and then twist to the other side.", "Repeat the series, alternating each side, for 10 or more reps."]}, "x-pushups-close-and-wide-hand-positions": {"mus": {"p": ["chest"], "s": ["delts", "triceps"]}, "steps": ["Lie on the floor face down and body straight with your toes on the floor and the hands wider than shoulder width for a wide hand position and closer than shoulder width for a close hand position. Make sure you are holding your torso up at arms length.", "Lower yourself until your chest almost touches the floor as you inhale.", "Using your pectoral muscles, press your upper body back up to the starting position and squeeze your chest. Breathe out as you perform this step.", "After a second pause at the contracted position, repeat the movement for the prescribed amount of repetitions."]}, "x-rack-pull-with-bands": {"mus": {"p": ["lowback"], "s": ["forearms", "glutes", "hams", "quads", "traps"]}, "steps": ["Set up in a power rack with the bar on the pins. The pins should be set to the desired point; just below the knees, just above, or in the mid thigh position. Attach bands to the base of the rack, or secure them with dumbbells. Attach the other end to the bar. You may need to choke the bands to provide tension.", "Position yourself against the bar in proper deadlifting position. Your feet should be under your hips, your grip shoulder width, back arched, and hips back to engage the hamstrings. Since the weight is typically heavy, you may use a mixed grip, a hook grip, or use straps to aid in holding the weight.", "With your head looking forward, extend through the hips and knees, pulling the weight up and back until lockout. Be sure to pull your shoulders back as you complete the movement. Return the weight to the pins and repeat."]}, "x-rack-pulls": {"mus": {"p": ["lowback"], "s": ["forearms", "glutes", "hams", "traps"]}, "steps": ["Set up in a power rack with the bar on the pins. The pins should be set to the desired point; just below the knees, just above, or in the mid thigh position. Position yourself against the bar in proper deadlifting position. Your feet should be under your hips, your grip shoulder width, back arched, and hips back to engage the hamstrings. Since the weight is typically heavy, you may use a mixed grip, a hook grip, or use straps to aid in holding the weight.", "With your head looking forward, extend through the hips and knees, pulling the weight up and back until lockout. Be sure to pull your shoulders back as you complete the movement.", "Return the weight to the pins and repeat."]}, "x-rear-leg-raises": {"mus": {"p": ["quads"], "s": []}, "steps": ["Place yourself on your hands knees on an exercise mat. Your head should be looking forward and the bend of the knees should create a 90-degree angle between the hamstrings and the calves. This will be your starting position.", "Extend one leg up and behind you. The knee and hip should both extend. Repeat for 5-10 repetitions, and then switch sides."]}, "x-reverse-band-bench-press": {"mus": {"p": ["triceps"], "s": ["chest", "delts", "forearms", "lats"]}, "steps": ["Position a bench inside a power rack, with the bar set to the correct height. Begin by anchoring bands either to band pegs or to the top of the rack. Ensure that you will be position properly under the bands. Attach the other end to the barbell.", "Lie on the bench, tuck your feet underneath you and arch your back. Using the bar to help support your weight, lift your shoulder off the bench and retract them, squeezing the shoulder blades together. Use your feet to drive your traps into the bench. Maintain this tight body position throughout the movement. However wide your grip, it should cover the ring on the bar.", "Pull the bar out of the rack without protracting your shoulders. Focus on squeezing the bar and trying to pull it apart. Lower the bar to your lower chest or upper stomach. The bar, wrist, and elbow should stay in line at all times.", "Pause when the barbell touches your torso, and then drive the bar up with as much force as possible. The elbows should be tucked in until lockout."]}, "x-reverse-band-box-squat": {"mus": {"p": ["quads"], "s": ["adductors", "calves", "forearms", "glutes", "hams", "lowback"]}, "steps": ["Begin in a power rack with a box at the appropriate height behind you. Set up the bands either on band pegs or attached to the top of the rack, ensuring they will be directly above the bar during the squat. Attach the other end to the bar.", "Begin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wider for more emphasis on the back, glutes, adductors, and hamstrings, or closer together for more quad development. Keep your head facing forward.", "With your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips until you are seated on the box. Ideally, your shins should be perpendicular to the ground. Pause when you reach the box, and relax the hip flexors. Never bounce off of a box.", "Keeping the weight on your heels and pushing your feet and knees out, drive upward off of the box as you lead the movement with your head. Continue upward, maintaining tightness head to toe. Use care to return the barbell to the rack."]}, "x-reverse-band-deadlift": {"mus": {"p": ["lowback"], "s": ["adductors", "calves", "glutes", "hams", "quads"]}, "steps": ["Set the bar up in a power rack. Attach bands to the top of the rack, using either bands pegs or the frame itself. Attach the other end of the bands to the bar.", "Approach the bar so that it is centered over your feet. You feet should be about hip width apart. Bend at the hip to grip the bar at shoulder width, allowing your shoulder blades to protract. Typically, you would use an overhand grip or an over/under grip on heavier sets.", "With your feet, and your grip set, take a big breath and then lower your hips and bend the knees until your shins contact the bar. Look forward with your head, keep your chest up and your back arched, and begin driving through the heels to move the weight upward.", "After the bar passes the knees, aggressively pull the bar back, pulling your shoulder blades together as you drive your hips forward into the bar.", "Lower the bar by bending at the hips and guiding it to the floor."]}, "x-reverse-band-power-squat": {"mus": {"p": ["quads"], "s": ["adductors", "calves", "glutes", "hams", "lowback"]}, "steps": ["Begin in a power rack with the pins and bar set at the appropriate height. After loading the bar, attach bands to the top of the rack, using either pegs or the frame itself. Attach the other end of the bands to the bar.", "Begin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wide for more emphasis on the back, glutes, adductors, and hamstrings.", "Keep your head facing forward. With your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips as much as possible. Ideally, your shins should be perpendicular to the ground. Lower bar position necessitates a greater torso lean to keep the bar over the heels. Continue until you break parallel, which is defined as the crease of the hip being in line with the top of the knee.", "Keeping the weight on your heels and pushing your feet and knees out, drive upward as you lead the movement with your head. Continue upward, maintaining tightness head to toe, until you have returned to the starting position."]}, "x-reverse-band-sumo-deadlift": {"mus": {"p": ["hams"], "s": ["adductors", "calves", "forearms", "glutes", "lowback", "quads", "traps"]}, "steps": ["Begin with a bar loaded on the floor inside of a power rack. Attach bands to the top of the rack, using either pegs or the frame itself. Attach the other end to the barbell.", "Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be directly below the shoulders, inside the legs, and you can use a pronated grip, a mixed grip, or hook grip. Relax the shoulders, which in effect lengthens your arms.", "Take a breath, and then lower your hips, looking forward with your head with your chest up. Drive through the floor, spreading your feet apart, with your weight on the back half of your feet. Extend through the hips and knees.", "As the bar passes through the knees, lean back and drive the hips ar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.", "Slowly begin to bring the bar back to starting position as your breathe in."]}, "x-reverse-crunch": {"mus": {"p": ["abs"], "s": []}, "steps": ["Lie down on the floor with your legs fully extended and arms to the side of your torso with the palms on the floor. Your arms should be stationary for the entire exercise.", "Move your legs up so that your thighs are perpendicular to the floor and feet are together and parallel to the floor. This is the starting position.", "While inhaling, move your legs towards the torso as you roll your pelvis backwards and you raise your hips off the floor. At the end of this movement your knees will be touching your chest.", "Hold the contraction for a second and move your legs back to the starting position while exhaling."]}, "x-reverse-flyes-with-external-rotation": {"mus": {"p": ["delts"], "s": []}, "steps": ["To begin, lie down on an incline bench set at a 30-degree angle with the chest and stomach pressing against the incline.", "Have the dumbbells in each hand with the palms facing down to the floor. Your arms should be in front of you so that they are perpendicular to the angle of the bench. Tip: Your elbows should have a slight bend. The legs should be stationary while applying pressure with the ball of your toes (your heels should not be touching the floor). This is the starting position.", "Maintaining the slight bend of the elbows, move the weights out and away from each other in an arc motion while exhaling.", "As you lift the weight, your wrist should externally rotate by 90-degrees so that you go from a palms down (pronated) grip to a palms facing each other (neutral) grip. Tip: Try to squeeze your shoulder blades together to get the best results from this exercise.", "The arms should be elevated until they are level with the head.", "Feel the contraction and slowly lower the weights back down to the starting position while inhaling."]}, "x-reverse-grip-bent-over-rows": {"mus": {"p": ["lats"], "s": ["biceps", "delts"]}, "steps": ["Stand erect while holding a barbell with a supinated grip (palms facing up).", "Bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The barbell should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.", "While keeping the torso stationary, lift the barbell as you breathe out, keeping the elbows close to the body and not doing any force with the forearm other than holding the weights. On the top contracted position, squeeze the back muscles and hold for a second.", "Slowly lower the weight again to the starting position as you inhale."]}, "x-reverse-grip-triceps-pushdown": {"mus": {"p": ["triceps"], "s": []}, "steps": ["Start by setting a bar attachment (straight or e-z) on a high pulley machine.", "Facing the bar attachment, grab it with the palms facing up (supinated grip) at shoulder width. Lower the bar by using your lats until your arms are fully extended by your sides. Tip: Elbows should be in by your sides and your feet should be shoulder width apart from each other. This is the starting position.", "Slowly elevate the bar attachment up as you inhale so it is aligned with your chest. Only the forearms should move and the elbows/upper arms should be stationary by your side at all times.", "Then begin to lower the cable bar back down to the original staring position while exhaling and contracting the triceps hard."]}, "x-reverse-triceps-bench-press": {"mus": {"p": ["triceps"], "s": ["chest", "delts"]}, "steps": ["Lie back on a flat bench. Using a close, supinated grip (around shoulder width), lift the bar from the rack and hold it straight over you with your arms locked extended in front of you and perpendicular to the floor. This will be your s lexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending (other than the slight initial bend we created during positioning) at any time. Hold the contracted position by a second before you start to go back down.", "Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.", "Now lift your toes by contracting the tibia muscles in the front of the calves as you breathe out."]}, "x-rope-crunch": {"mus": {"p": ["abs"], "s": []}, "steps": ["Kneel 1-2 feet in front of a cable system with a rope attached.", "After selecting an appropriate weight, grasp the rope with both hands reaching overhead. Your torso should be upright in the starting position.", "To begin, flex at the spine, attempting to bring your rib cage to your legs as you pull the cable down.", "Pause at the bottom of the motion, and then slowly return to the starting position.", "These can be done with twists or to the side to hit the obliques."]}, "x-russian-twist": {"mus": {"p": ["abs"], "s": ["lowback"]}, "steps": ["Lie down on the floor placing your feet either under something that will not move or by having a partner hold them. Your legs should be bent at the knees.", "Elevate your upper body so that it creates an imaginary V-shape with your thighs. Your arms should be fully extended in front of you perpendicular to your torso and with the hands clasped. This is the starting position.", "Twist your torso to the right side until your arms are parallel with the floor while breathing out.", "Hold the contraction for a second and move back to the starting position while breathing out. Now move to the opposite side performing the same techniques you applied to the right side."]}, "x-scissor-kick": {"mus": {"p": ["abs"], "s": []}, "steps": ["To begin, lie down with your back pressed against the floor or on an exercise mat (optional). Your arms should be fully extended to the sides with your palms aced on top of your thighs. Your feet should be shoulder width apart from each other.", "Grip the bar with your palms facing down and make sure your hands are wider than shoulder width apart from each other. Begin to lift the barbell up over your head until your arms are fully extended.", "Now lower the barbell behind your head until it is resting along the base of your neck. This is the starting position.", "While keeping your feet and head stationary, move your waist from side to side so that your oblique muscles feel the contraction. Only move from side to side as far as your waist will allow you to go. Stretching or moving too far can cause an injury to occur. Tip: Use a slow and controlled motion.", "Remember to breathe out while twisting your body to the side and in when moving back to the starting position."]}, "x-seated-bent-over-one-arm-dumbbell-tricep": {"mus": {"p": ["triceps"], "s": []}, "steps": ["Sit down at the end of a flat bench with a dumbbell in one arm using a neutral grip (palms of the hand facing you).", "Bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Make sure that you keep the head up.", "The upper arm with the dumbbell should be close to the torso and aligned with it (lifted up until it is parallel to the floor while the forearms are pointing towards the floor as the hands hold the weights). Tip: There should be a 90-degree angle between the forearms and the upper arm. This is your starting position.", "Keeping the upper arm stationary, use the triceps to lift the weight as you exhale until the forearm is parallel to the floor and the whole arm is extended. Like many other arm exercises, only the forearm moves.", "After a second contraction at the top, slowly lower the dumbbell back to the starting position as you inhale.", "Repeat the movement for the prescribed amount of repetitions."]}, "x-seated-bent-over-rear-delt-raise": {"mus": { ": ["Sit on the floor with your knees bent and your partner standing behind you. Extend your arms straight behind you with your palms facing each other. Your partner will hold your wrists for you. This will be the starting position.", "Attempt to flex your elbows, while your partner prevents any actual movement.", "After 10-20 seconds, relax your arms while your partner gently pulls your wrists up to stretch your biceps. Be sure to let your partner know when the stretch is appropriate to prevent injury or overstretching."]}, "x-seated-cable-shoulder-press": {"mus": {"p": ["delts"], "s": ["triceps"]}, "steps": ["Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 90 degrees to the body, with your head and chest up. The elbows should also be bent to about 90 degrees. This will be your starting position.", "Begin by extending through the elbow, pressing the handles together above your head.", "After pausing at the top, return the handles to the starting position. Ensure that you maintain tension on the cables.", "You can also execute this movement with your back off the pad and alternate hands."]}, "x-seated-close-grip-concentration-barbell-": {"mus": {"p": ["biceps"], "s": []}, "steps": ["Sit down on a flat bench with a barbell or E-Z Bar in front of you in between your legs. Your legs should be spread with the knees bent and the feet on the floor.", "Use your arms to pick the barbell up and place the back of your upper arms on top of your inner thighs (around three and a half inches away from the front of the knee). A supinated grip closer than shoulder width is needed to perform this exercise. Tip: Your arm should be extended at arms length and the barbell should be above the floor. This will be your starting position.", "While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps.", "Slowly begin to bring the barbell back to starting position as your breathe in. Tip: Avoid swinging motions at any time."]}, "x-seated-dumbbell-curl": {"mus": {"p": ["biceps"], "s": []}, "steps": ["Sit on a flat bench with a dumbbell on each hand being held at arms length. The elbows should be close to the torso.", "Rotate the palms of the hands so that they are facing your torso. This will be your starting position.", "While holding the upper arm stationary, curl the weights and start twisting the wrists once the dumbbells pass your thighs so that the palms of your hands face forward at the end of the movement. Make sure that you contract the biceps as you breathe out and make sure that only the forearms move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps.", "Slowly begin to bring the dumbbells back to the starting position as your breathe in and as you rotate the wrists back to a neutral grip."]}, "x-seated-dumbbell-inner-biceps-curl": {"mus": {"p": ["biceps"], "s": []}, "steps": ["Sit on the end of a flat bench with a dumbbell in each hand being held at arms length. The elbows should be close to the torso.", "Rotate the palms of the hands so that they are facing inward in a neutral position. This will be your starting position.", "While holding the upper arms stationary, curl the dumbbells out and up, turning the palms out as you lift and keeping your forearms in line with your outer deltoids. Tips:", "Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps.", "Slowly begin to bring the dumbbells back to the starting position as your breathe in. Remember to rotate your r body, but with your left arm. Breathe out as you perform this movement.", "Once you reach the top position breathe in. Then, with the weight fully extended overhead and you bent over to your right hand side, begin the movement to the left side."]}, "x-shotgun-row": {"mus": {"p": ["lats"], "s": ["biceps"]}, "steps": ["Attach a single handle to a low cable.", "After selecting the correct weight, stand a couple feet back with a wide-split stance. Your arm should be extended and your shoulder forward. This will be your starting position.", "Perform the movement by retracting the shoulder and flexing the elbow. As you pull, supinate the wrist, turning the palm upward as you go.", "After a brief pause, return to the starting position."]}, "x-shoulder-press-with-bands": {"mus": {"p": ["delts"], "s": ["triceps"]}, "steps": ["To begin, stand on an exercise band so that tension begins at arm's length. Grasp the handles and lift them so that the hands are at shoulder height at each side.", "Rotate the wrists so that the palms of your hands are facing forward. Your elbows should be bent, with the upper arms and forearms in line to the torso. This is your starting position.", "As you exhale, lift the handles up until your arms are fully extended overhead."]}, "x-side-bridge": {"mus": {"p": ["abs"], "s": ["delts"]}}, "x-side-jackknife": {"mus": {"p": ["abs"], "s": []}}, "x-side-laterals-to-front-raise": {"mus": {"p": ["delts"], "s": ["traps"]}, "steps": ["In a standing position, hold a pair of dumbbells at your side. This will be your starting position.", "Keeping your elbows slightly bent, raise the weights directly in front of you to shoulder height, avoiding any swinging or cheating.", "At the top of the exercise move the weights out in front of you, keeping your arms extended.", "Lower the weights with a controlled motion.", "On the next repetition, raise the weights in front of you to shoulder height before moving the weights laterally to your sides.", "Lower the weights to the starting position."]}, "x-side-leg-raises": {"mus": {"p": ["adductors"], "s": []}, "steps": ["Stand next to a chair, which you may hold onto as a support. Stand on one leg. This will be your starting position.", "Keeping your leg straight, raise it as far out to the side as possible, and swing it back down, allowing it to cross the opposite leg.", "Repeat this swinging motion 5-10 times, increasing the range of motion as you do so."]}, "x-single-arm-cable-crossover": {"mus": {"p": ["chest"], "s": []}, "steps": ["Begin by moving the pulleys to the high position, select the resistance to be used, and take a handle in each hand.", "Step forward in front of both pulleys with your arms extended in front of you, bringing your hands together. Your head and chest should be up as you lean forward, while your feet should be staggered. This will be your starting position.", "Keeping your left arm in place, allow your right arm to extend out to the side, maintaining a slight bend at the elbow. The right arm should be perpendicular to the body at approximately shoulder level.", "Return your arm back to the starting position by pulling your hand back to the midline of the body.", "Hold for a second at the starting position and repeat the movement on the opposite side. Continue alternating back and forth for the prescribed number of repetitions."]}, "x-single-arm-linear-jammer": {"mus": {"p": ["delts"], "s": ["chest", "triceps"]}, "steps": ["Position a bar into a landmine or securely anchor it in a corner. Load the bar to an appropriate weight.", "Raise the bar from the floor, taking it to your shoulders with one or both hands. Adopt a wide stance. This will be your starting position.", "Perform the movement by extending the elbow, pressing the weight up. Move explosively, extending the hips and knees fully to produce maximal force.", "Return to the starting position."]}, "x-single-arm-push-up": {"mus": {"p": ["chest"], "s": ["delts", "triceps"]}, "steps": ["Begin laying prone on the ground. Move yourself into a position supporting your weight on your toes and one arm. Your working arm should be placed directly under the shoulder, fully extended. Your legs should be extended, and for this movement you may need a wider base, placing your feet further apart than in a normal push-up.", "Maintain good posture, and place your free hand behind your back. This will be your starting position.", "Lower yourself by allowing the elbow to flex until you touch the ground.", "Descend slowly, and reverse direction be extending the arm to return to the starting position."]}, "x-single-dumbbell-raise": {"mus": {"p": ["delts"], "s": ["forearms", "traps"]}, "steps": ["With a wide stance, hold a dumbell with both hands, grasping the head of the dumbbell instead of the handle. Your arms should be extended and hanging at the waist. This will be your starting position.", "Raise the weight until it is above shoulder level, keeping your arms extended. Your torso and hips should remain stationary throughout the movement.", "Return to the starting position and repeat for the recommended amount of repetitions."]}, "x-single-leg-butt-kick": {"mus": {"p": ["quads"], "s": ["calves", "hams"]}, "steps": ["Begin by standing on one leg, with the bent knee raised. This will be your start position.", "Using a countermovement jump, take off upward by extending the hip, knee, and ankle of the grounded leg.", "Immediately flex the knee and attempt to touch your butt with the heel of your jumping leg.", "Return the leg to a partially bent position underneath the hips and land. Your opposite leg should stay in relatively the same position throughout the drill."]}, "x-single-leg-glute-bridge": {"mus": {"p": ["glutes"], "s": ["hams"]}, "steps": ["Lay on the floor with your feet flat and knees bent.", "Raise one leg off of the ground, pulling the knee to your chest. This will be your starting position.", "Execute the movement by driving through the heel, extending your hip upward and raising your glutes off of the ground.", "Extend as far as possible, pause and then return to the starting position."]}, "x-sit-up": {"mus": {"p": ["abs"], "s": []}, "steps": ["Lie down on the floor placing your feet either under something that will not move or by having a partner hold them. Your legs should be bent at the knees.", "Place your hands behind your head and lock them together by clasping your fingers. This is the starting position.", "Elevate your upper body so that it creates an imaginary V-shape with your thighs. Breathe out when performing this part of the exercise.", "Once you feel the contraction for a second, lower your upper body back down to the starting position while inhaling."]}, "x-smith-incline-shoulder-raise": {"mus": {"p": ["delts"], "s": ["chest"]}, "steps": ["Place an incline bench underneath the smith machine. Place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Once the weight you need is selected, lie down on the incline bench and make sure your shoulders are aligned right under the barbell.", "Using a shoulder width pronated (palms forward) grip, lift the bar from the rack and hold it straight over you with a slight bend at the elbows. This will be your starting position.", "As you breathe out, lift the bar up until your arms are fully extended. Note: The contraction should be felt around the shoulders.", "After a second pause, bring the bar back down to the starting position as you breathe in.", "Repeat the movement for the prescribed amount of repetitions.", "When you are done, place the bar back in the rack."]}, "x-snatch-pull": {"mus": {"p": ["hams"], "s": ["calves", "glutes", "lowback", "quads", "traps"]}, "steps": ["With a barbell on the floor close to the shins, take a wide snatch grip. Lower your hips with the weight focused on the heels, back straight, head facing forward, chest up, with your shoulders just in front of the bar. This will be your starting position.", n front of the box. Sit back with your hips until you are seated on the box, ensuring that you descend under control and don't crash onto the surface.", "Pause briefly, and explode off of the box, extending through the hips and knees."]}, "x-speed-squats": {"mus": {"p": ["quads"], "s": ["calves", "glutes", "hams", "lowback"]}, "steps": ["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.", "Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.", "Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance which targets overall development; however you can choose any of the three stances discussed in the foot stances section).", "Begin to lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.", "Begin to raise the bar as fast as possible without involving momentum as you exhale by uat-with-bands": {"mus": {"p": ["quads"], "s": ["adductors", "calves", "glutes", "hams", "lowback"]}, "steps": ["Set up the bands on the sleeves, secured to either band pegs, the rack, or dumbbells so that there is appropriate tension.", "Begin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wide for more emphasis on the back, glutes, adductors, and hamstrings. Keep your head facing forward.", "With your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips as much as possible. Ideally, your shins should be perpendicular to the ground. Lower bar position necessitates a greater torso lean to keep the bar over the heels. Continue until you break parallel, which is defined as the crease of the hip being in line with the top of the knee.", "Keeping the weight on your heels and pushing your feet and knees out, drive upward as you lead the movement with your head. Continue upward, maintaining tightness head to toe, until you have returned to the starting position."]}, "x-squat-with-chains": {"mus": {"p": ["quads"], "s": ["adductors", "calves", "glutes", "hams", "lowback"]}, "steps": ["To set up the chains, begin by looping the leader chain over the sleeves of the bar. The heavy chain should be attached using a snap hook. Adjust the length of the lead chain so that a few links are still on the floor at the top of the movement.", "Begin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wide for more emphasis on the back, glutes, adductors, and hamstrings. Keep your head facing forward.", "With your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips as much as possible. Ideally, your shins should be perpendicular to the ground. Lower bar position necessitates a greater torso lean to keep the bar over the heels. Continue until you break parallel, which is defined as the crease of the hip being in line with the top of the knee.", "Keeping the weight on your heels and pushing your feet and knees out, drive upward as you lead the movement with your head. Continue upward, maintaining tightness head to toe, until you have returned to the starting position."]}, "x-squat-with-plate-movers": {"mus": {"p": ["quads"], "s": ["adductors", "calves", "glutes", "hams"]}, "steps": ["To begin, first set the bar on a rack to just below shoulder level. Position a weight plate on the ground a couple feet back from the rack. Once the bar is loaded, step under it and place the back of your shoulders across it.", "Hold on to the bar with both hands and lift it off the rack by first pushing with your legs and at the same time straighten your torso.", "Step away from the rack and adopt a wide stance with the toes slightly pointed out, with one foot on the weight plate. Keep your head up at all times. This will be your starting position.", "Begin to slowly lower the bar by bending the knees and hips. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees.", "Raise the bar as you exhale by pushing the floor with the heels of your feet as you extend the hips and knees.", "At the top of the movement, side step, bringing your feet together on the opposite side of the plate."]}, "x-squats-with-bands": {"mus": {"p": ["quads"], "s": ["calves", "glutes", "hams", "lowback"]}, "steps": ["To start out, make sure that the exercise band is at an even split between both the left and right side of the body. To do this, use your hands to grab both sides of the band and place both feet in the middle of the band. Your feet should be shoulder width apart from each other.", "When holding the bands, they should be the same height on each side. You should be using a pronated grip (palms facing forward) and have the handles of the bands next to your face for this exercise. This is the starting position.", "Slowly start to bend the knees and lower the legs so that your thighs are parallel to the floor while exhaling.", "Use the heel of your feet to push your body up to the starting position as you exhale."]}, "x-standing-alternating-dumbbell-press": {"mus": {"p": ["delts"], "s": ["triceps"]}, "steps": ["Stand with a dumbbell in each hand. Raise the dumbbells to your shoulders with your palms facing forward and your elbows pointed out. This will be your starting position.", "Extend one arm to press the dumbbell straight up, keeping your off hand in place. Do not lean or jerk the weight during the movement.", "After a brief pause, return the weight to the starting position.", "Repeat for the opposite side, continuing to alternate between arms."]}, "x-standing-barbell-calf-raise": {"mus": {"p": ["calves"], "s": []}, "steps": ["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the bar on the back of your shoulders (slightly below the neck).", "Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.", "Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. The knees should be kept with a slight bend; never locked. This will be your starting position. Tip: For better range of motion you may also place the ball of your feet on a wooden block but be careful as this option requires more balance and a sturdy block.", "Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.", "Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched."]}, "x-standing-barbell-press-behind-neck": {"mus": {"p": ["delts"], "s": ["triceps"]}, "steps": ["This exercise is best performed inside a squat rack for easier pick up of the bar. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.", "Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.", "Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Your back should be kept straight while performing this exercise. This will be your starting position.", "Elevate the barbell overhead by fully extending your arms while breathing out.", "Hold the contraction for a second and lower the barbell back down to the starting position by inhaling."]}, "x-standing-bent-over-one-arm-dumbbell-tric": {"mus": {"p": ["triceps"], "s": ["delts"]}, "steps": ["With a dumbbell in one hand and the palm facing your torso, bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Make sure that you keep the head up.", "The upper arm should be close to the torso and parallel to the floor while the forearm is pointing towards the floor as the hand holds the weight. Tip: There should be a 90-degree angle between the forearm and the upper arm. This is your starting position.", "Keeping the upper arms stationary, use the triceps to lift the weights as you exhale until the forearms are parallel to the floor and the whole arm is extended. Like many other arm exercises, only the forearm moves.", "After a second contraction at the top, slowly lower the dumbbell back to the starting position as you inhale.", "Repeat the movement for the prescribed amount of repetitions.", "Switch arms and repeat the exercise."]}, "x-standing-bent-over-two-arm-dumbbell-tric": {"mus": {"p": ["triceps"], "s": []}, "steps": ["With a dumbbell in each hand and the palms facing your torso, bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Make sure that you keep the head up. The upper arms should be close to the torso and parallel to the floor while the forearms are pointing towards the floor as the hands hold the weights. Tip: There should be a 90-degree angle between the forearms and the upper arm. This is your starting position.", "Keeping the upper arms stationary, use the triceps to lift the weights as you exhale until the forearms are parallel to the floor and the whole arms are extended. Like many other arm exercises, only the forearm moves.", "After a second contraction at the top, slowly lower the dumbbells back to their starting position as you inhale.", "Repeat the movement for the prescribed amount of repetitions."]}, "x-standing-bradford-press": {"mus": {"p": ["delts"], "s": ["triceps"]}, "steps": ["Place a loaded bar at shoulder level in a rack. With a pronated grip at shoulder width, begin with the bar racked across the front of your shoulders. This is your starting position.", "Initiate the lift by extending the elbows to press the bar overhead. Avoid locking out the  tower, and move the cable to the highest pulley position.", "With your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Your outstretched arm should be aligned with the cable.", "With your feet positioned shoulder width apart, reach upward with your other hand and grab the handle with both hands. Your arms should still be fully extended.", "In one motion, pull the handle down and across your body to your front knee while rotating your torso.", "Keep your back and arms straight and core tight while you pivot your back foot and bend your knees to get a full range of motion.", "Maintain your stance and straight arms. Return to the neutral position in a slow and controlled manner."]}, "x-standing-concentration-curl": {"mus": {"p": ["biceps"], "s": ["forearms"]}, "steps": ["Taking a dumbbell in your working hand, lean forward. Allow your working arm to hang perpendicular to the ground with the elbow pointing out. This will be your starting position.", "Flex the elbow to curl the weight, keeping the upper arm stationary. At the top of the repetition, flex the biceps and pause.", "Lower the dumbbell back to the starting position.", "Repeat the movement for the prescribed amount of repetitions."]}, "x-standing-dumbbell-press": {"mus": {"p": ["delts"], "s": ["triceps"]}, "steps": ["Standing with your feet shoulder width apart, take a dumbbell in each hand. Raise the dumbbells to head height, the elbows out and about 90 degrees. This will be your starting position.", "Maintaining strict technique with no leg drive or leaning back, extend through the elbow to raise the weights together directly above your head.", "Pause, and slowly return the weight to the starting position."]}, "x-standing-dumbbell-reverse-curl": {"mus": {"p": ["biceps"], "s": ["forearms"]}, "steps": ["To begin, stand straight with a dumbbell in each hand using a pronated
