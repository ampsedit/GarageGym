e barbell. Breathe out as you perform this step."]}, "x-standing-palm-in-one-arm-dumbbell-press": {"mus": {"p": ["delts"], "s": ["triceps"]}, "steps": ["Start by having a dumbbell in one hand with your arm fully extended to the side using a neutral grip. Use your other arm to hold on to an incline bench to keep your balance.", "Your feet should be shoulder width apart from each other. Now slowly lift the dumbbell up until you create a 90 degree angle with your arm. Note: Your forearm should be perpendicular to the floor. Continue to maintain a neutral grip throughout the entire exercise.", "Slowly lift the dumbbell up until your arm is fully extended. This the starting position.", "While inhaling lower the weight down until your arm is at a 90 degree angle again.", "Feel the contraction for a second and then lift the weight back up towards the starting position while exhaling. Remember to hold on to the incline bench and keep your feet positioned to keep balance during the exercise.", "Switch arms and repeat the exercise."]}, "x-standing-palms-in-dumbbell-press": {"mus": {"p": ["delts"], "s": ["triceps"]}, "steps": ["Start by having a dumbbell in each hand with your arm fully extended to the side using a neutral grip. Your feet should be shoulder width apart from each other. Now slowly lift the dumbbells up until you create a 90 degree angle with your arms. Note: Your forearms should be perpendicular to the floor. This the starting position.", "Continue to maintain a neutral grip throughout the entire exercise. Slowly lift the dumbbells up until your arms are fully extended.", "While inhaling lower the weights down until your arm is at a 90 degree angle again."]}, "x-standing-palms-up-barbell-behind-the-bac": {"mus": {"p": ["forearms"], "s": []}, "steps": ["Start by standing straight and holding a barbell behind your glutes at arm's length while using a pronated grip (palms will be facing back away from the glutes) and having your hands shoulder width apart from each other.", "You should be looking straight forward while your feet are shoulder width apart from each other. This is the starting position.", "While exhaling, slowly elevate the barbell up by curling your wrist in a semi-circular motion towards the ceiling. Note: Your wrist should be the only body part moving for this exercise.", "Hold the contraction for a second and lower the barbell back down to the starting position while inhaling.", "When finished, lower the barbell down to the squat rack or the floor by bending the knees. Tip: It is easiest to either pick it up from a squat rack or have a partner hand it to you."]}, "x-standing-rope-crunch": {"mus": {"p": ["abs"], "s": []}, "steps": ["Attach a rope to a high pulley and select an appropriate weight.", "Stand with your back to the cable tower. Take the rope with both hands over your shoulders, holding it to your upper chest. This will be your starting position.", "Perform the movement by flexing the spine, crunching the weight down as far as you can.", "Hold the peak contraction for a moment before returning to the starting position."]}, "x-standing-towel-triceps-extension": {"mus": {"p": ["triceps"], "s": []}, "steps": ["To begin, stand up with both arms fully extended above the head holding one end of a towel with both hands. Your elbows should be in and the arms perpendicular to the floor with the palms facing each other while your feet should be shoulder width apart from each other. This is the starting position.", "Now communicate with your partner so that he/she can grip the other side of the towel to apply resistance. Keeping your upper arms close to your head (elbows in) and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.", "Go back to the starting position by using the triceps to raise the towel. Breathe out as you perform this step."]}, "x-star-jump": {"mus": {"p": ["quads"], "s": ["calves", "delts", "glutes", "hams"]}, "steps": ["Begin in a relaxed stance with your feet shoulder width apart and hold your arms close to the body.", "To initiate the move, squat down halfway and explode back up as high as possible. Fully extend your entire body, spreading your legs and arms away from the body.", "As you land, bring your limbs back in and absorb your impact through the legs."]}, "x-step-up-with-knee-raise": {"mus": {"p": ["glutes"], "s": ["hams", "quads"]}, "steps": ["Stand facing a box or bench of an appropriate height with your feet together. This will be your starting position.", "Begin the movement by stepping up, putting your left foot on the top of the bench. Extend through the hip and knee of your front leg to stand up on the box. As you stand on the box with your left leg, flex your right knee and hip, bringing your knee as high as you can.", "Reverse this motion to step down off the box, and then repeat the sequence on the opposite leg."]}, "x-stiff-legged-barbell-deadlift": {"mus": {"p": ["hams"], "s": ["glutes", "lowback"]}, "steps": ["Grasp a bar using an overhand grip (palms facing down). You may need some wrist wraps if using a significant amount of weight.", "Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.", "Keeping the knees stationary, lower the barbell to over the top of your feet by bending at the hips while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Inhale as you perform this movement.", "Start bringing your torso up straight again by extending your hips until you are back at the starting position. Exhale as you perform this movement."]}, "x-stiff-leg-barbell-good-morning": {"mus": {"p": ["lowback"], "s": ["glutes", "hams"]}, "steps": ["T  {"p": ["hams"], "s": ["adductors", "forearms", "glutes", "lats", "lowback", "quads", "traps"]}, "steps": ["Begin with a bar loaded on the ground. Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be directly below the shoulders, inside the legs, and you can use a pronated grip, a mixed grip, or hook grip. Relax the shoulders, which in effect lengthens your arms.", "Take a breath, and then lower your hips, looking forward with your head with your chest up. Drive through the floor, spreading your feet apart, with your weight on the back half of your feet. Extend through the hips and knees.", "As the bar passes through the knees, lean back and drive the hips into the bar, pulling your shoulder blades together.", "Return the weight to the ground by bending at the hips and controlling the weight on the way down."]}, "x-sumo-deadlift-with-bands": {"mus": {"p": ["hams"], "s": ["adductors", "forearms", "glutes", "lats", "lowback", "quads", "traps"]}, "steps": ["To deadlift with short bands, simply loop them over the bar before you start, and step into them to set up. Ensure that they under the back half of your foot, directly where you are driving into the floor.", "Begin with a bar loaded on the ground. Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be directly below the shoulders, inside the legs, and you can use a pronated grip, a mixed grip, or hook grip.", "Take a breath, and then lower your hips, looking forward with your head with your chest up. Drive through the floor, spreading your feet apart, with your weight on the back half of your feet. Extend through the hips and knees.", "As the bar passes through the knees, lean back and drive the hips into the bar, pulling your shoulder blades together.", "Return the weight to the ground by bending at the hips and controlling the weight on the way down."]}, "x-sumo-deadlift-with-chains": {"mus": {"p": ["hams"], "s": ["adductors", "forearms", "glutes", "lats", "lowback", "quads", "traps"]}, "steps": ["You can attach the chains to the sleeves of the bar, or just drape the middle over the bar so there is a greater weight increase as you lift. Attempt to keep the ends of the chains away from the plates so you don't hit them when you lower the weight.", "Begin with a bar loaded on the ground. Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be directly below the shoulders, inside the legs, and you can use a pronated grip, a mixed grip, or hook grip. Relax the shoulders, which in effect lengthens your arms.", "Take a breath, and then lower your hips, looking forward with your head with your chest up. Drive through the floor, spreading your feet apart, with your weight on the back half of your feet. Extend through the hips and knees.", "As the bar passes through the knees, lean back and drive the hips into the bar, pulling your shoulder blades together.", "Return the weight to the ground by bending at the hips and controlling the weight on the way down."]}, "x-superman": {"mus": {"p": ["lowback"], "s": ["glutes", "hams"]}, "steps": ["To begin, lie straight and face down on the floor or exercise mat. Your arms should be fully extended in front of you. This is the starting position.", "Simultaneously raise your arms, legs, and chest off of the floor and hold this contraction for 2 seconds. Tip: Squeeze your lower back to get the best results from this exercise. Remember to exhale during this movement. Note: When holding the contracted position, you should look like superman when he is flying.", "Slowly begin to lower your arms, legs and chest back down to the starting position while inhaling."]}, "x-t-bar-row-with-handle": {"mus": {"p": ["lats"], "s": ["biceps"]}, "steps": ["Position a bar into a landmine or in a corner to keep it from moving. Load an appropriate weight onto your end.", "Stand over the bar, and position a Double D row handle around the bar next to the collar. Using your hips and legs, rise to a standing position.", "Assume a wide stance with your hips back and your chest up. Your arms should be extended. This will be your starting position.", "Pull the weight to your upper abdomen by retracting the shoulder blades and flexing the elbows. Do not jerk the weight or cheat during the movement.", "After a brief pause, return to the starting position."]}, "x-tate-press": {"mus": {"p": ["triceps"], "s": ["chest", "delts"]}, "steps": ["Lie down on a flat bench with a dumbbell in each hand on top of your thighs. The palms of your hand will be facing each other.", "By using your thighs to help you get the dumbbells up, clean the dumbbells one arm at a time so that you can hold them in front of you at shoulder width. Note: when holding the dumbbells in front of you, make sure your arms are wider than shoulder width apart from each other using a pronated (palms forward) grip. Allow your elbows to point out. This is your starting position.", "Keeping the upper arms stationary, slowly move the dumbbells in and down in a semi circular motion until they touch the upper chest while inhaling. Keep full control of the dumbbells at all times and do not move the upper arms nor rest the dumbbells on the chest.", "As you breathe out, move the dumbbells up using your triceps and the same semi-circular motion but in reverse. Attempt to keep the dumbbells together as they move up. Lock your arms in the contracted position, hold for a second and then start coming down again slowly again. Tip: It should take at least twice as long to go down than to come up.", "Repeat the movement for the prescribed amount of repetitions of your training program."]}, "x-toe-touchers": {"mus": {"p": ["abs"], "s": []}, "steps": ["To begin, lie down on the floor or an exercise mat with your back pressed against the floor. Your arms should be lying across your sides with the palms facing down.", "Your legs should be touching each other. Slowly elevate your legs up in the air until they are almost perpendicular to the floor with a slight bend at the knees. Your feet should be parallel to the floor.", "Move your arms so that they are fully extended at a 45 degree angle from the floor. This is the starting position.", "While keeping your lower back pressed against the floor, slowly lift your torso and use your hands to try and touch your toes. Remember to exhale while perform this part of the exercise.", "Slowly begin to lower your torso and arms back down to the starting position while inhaling. Remember to keep your arms straight out pointing towards your toes."]}, "x-tricep-dumbbell-kickback": {"mus": {"p": ["triceps"], "s": []}, "steps": ["Start with a dumbbell in each hand and your palms facing your torso. Keep your back straight with a slight bend in the knees and bend forward at the waist. Your torso should be almost parallel to the floor. Make sure to keep your head up. Your upper arms should be close to your torso and parallel to the floor. Your forearms should be pointed towards the floor as you hold the weights. There should be a 90-degree angle formed between your forearm and upper arm. This is your starting position.", "Now, while keeping your upper arms stationary, exhale and use your triceps to lift the weights until the arm is fully extended. Focus on moving the forearm.", "After a brief pause at the top contraction, inhale and slowly lower the dumbbells back down to the starting position.", "Repeat the movement for the prescribed amount of repetitions."]}, "x-triceps-overhead-extension-with-rope": {"mus": {"p": ["triceps"], "s": []}, "steps": ["Attach a rope to a low pulley. After selecting an appropriate weight, grasp the rope with both hands and face away from the cable.", "Position your hands behind your head with your elbows point straight up. Your elbows should start out flexed, and you can stagger your stance and lean gently away from the machine to create greater stability. This will be your starting position.", "To perform the movement, extend through the elbow while keeping the upper arm in position, raising your hands above your head.", "Squeeze your triceps at the top of the movement, and slowly lower the weight back to the start position."]}, "x-triceps-pushdown-v-bar-attachment": {"mus": {"p": ["triceps"], "s": []}, "steps": ["Attach a V-Bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.", "Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. The thumbs should be higher than the small finger. This is your starting position.", "Using the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.", "After a second hold at the contracted position, bring the V-Bar slowly up to the starting point. Breathe in as you perform this step."]}, "x-tuck-crunch": {"mus": {"p": ["abs"], "s": []}, "steps": ["To begin, lie down on the floor or an exercise mat with your back pressed against the floor. Your arms should be lying across your sides with the palms facing down.", "Your legs should be crossed by wrapping one ankle around the other. Slowly elevate your legs up in the air until your thighs are perpendicular to the floor with a slight bend at the knees. Note: Your knees and toes should be parallel to the floor as opposed to the thighs.", "Move your arms from the floor and cross them so they are resting on your chest. This is the starting position.", "While keeping your lower back pressed against the floor, slowly lift your torso. Remember to exhale while perform this part of the exercise.", "Slowly begin to lower your torso back down to the starting position while inhaling."]}, "x-two-arm-dumbbell-preacher-curl": {"mus": {"p": ["biceps"], "s": []}, "steps": ["Grab a dumbbell with each arm and place the upper arms on top of the preacher bench or the incline bench. The dumbbell should be held at shoulder length. This will be your starting position.", "As you breathe in, slowly lower the dumbbells until your upper arm is extended and the biceps is fully stretched.", "As you exhale, use the biceps to curl the weights up until your biceps is fully contracted and the dumbbells are at shoulder height.", "Squeeze the biceps hard for a second at the contracted position and repeat for the recommended amount of repetitions."]}, "x-underhand-cable-pulldowns": {"mus": {"p": ["lats"], "s": ["biceps", "delts"]}, "steps": ["Sit down on a pull-down machine with a wide bar attached to the top pulley. Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.", "Grab the pull-down bar with the palms facing your torso (a supinated grip). Make sure that the hands are placed closer than the shoulder width.", "As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.", "As you breathe out, pull the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the fully contracted position and keep the elbows close to your body. The upper torso should remain stationary as your bring the bar to you and only the arms should move. The forearms should do no other work other than hold the bar.", "After a second on the contracted position, while breathing in, slowly bring the bar back to the starting position when your arms are fully extended and the lats are fully stretched.", "Repeat this motion for the prescribed amount of repetitions."]}, "x-upright-barbell-row": {"mus": {"p": ["delts"], "s": ["traps"]}, "steps": ["Grasp a barbell with an overhand grip that is slightly less than shoulder width. The bar should be resting on the top of your thighs with your arms extended and a slight bend in your elbows. Your back should also be straight. This will be your starting position.", "Now exhale and use the sides of your shoulders to lift the bar, raising your elbows up and to the side. Keep the bar close to your body as you raise it. Continue to lift the bar until it nearly touches your chin. Tip: Your elbows should drive the motion, and should always be higher than your forearms. Remember to keep your torso stationary and pause for a second at the top of the movement.", "Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement."]}, "x-upright-cable-row": {"mus": {"p": ["traps"], "s": ["delts"]}, "steps": ["Grasp a straight bar cable attachment that is attached to a low pulley with a pronated (palms facing your thighs) grip that is slightly less than shoulder width. The bar should be resting on top of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.", "Use your side shoulders to lift the cable bar as you exhale. The bar should be close to the body as you move it up. Continue to lift it until it nearly touches your chin. Tip: Your elbows should drive the motion. As you lift the bar, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.", "Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement."]}, "x-upright-row-with-bands": {"mus": {"p": ["traps"], "s": ["delts"]}, "steps": ["To begin, stand on an exercise band so that tension begins at arm's length. Grasp the handles using a pronated (palms facing your thighs) grip that is slightly less than shoulder width. The handles should be resting on top of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.", "Use your side shoulders to lift the handles as you exhale. The handles should be close to the body as you move them up. Continue to lift the handles until they nearly touches your chin. Tip: Your elbows should drive the motion. As you lift the handles, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.", "Lower the handles back down slowly to the starting position. Inhale as you perform this portion of the movement."]}, "x-vertical-swing": {"mus": {"p": ["hams"], "s": ["delts", "glutes", "quads"]}, "steps": ["Allow the dumbbell to hang at arms length between your legs, holding it with both hands. Keep your back straight and your head up.", "Swing the dumbbell between your legs, flexing at the hips and bending the knees slightly.", "Powerfully reverse the motion by extending at the hips, knees, and ankles to propel yourself upward, swinging the dumbell over your head.", "As you land, absorb the impact through your legs and draw the dumbbell to your torso before the next repetition."]}, "x-weighted-jump-squat": {"mus": {"p": ["quads"], "s": ["calves", "glutes", "hams", "lowback"]}, "steps": ["Position a lightly loaded barbell across the back of your shoulders. You could also use a weighted vest, sandbag, or other type of resistance for this exercise.", "The weight should be light enough that it doesn't slow you down significantly. Your feet should be just outside of shoulder width with your head and chest up. This will be your starting position.", "Using a countermovement, squat partially down and immediately reverse your direction to explode off of the ground, extending through your hips, knees, and ankles. Maintain good posture throughout the jump.", "As you return to the ground, absorb the impact through your legs."]}, "x-weighted-sissy-squat": {"mus": {"p": ["quads"], "s": ["calves", "glutes", "hams"]}, "steps": ["Standing upright, with feet at shoulder width and toes raised, use one hand to hold onto the beams of a squat rack and the opposite arm to hold a plate on top of your chest. This is your starting position.", "As you use one arm to hold yourself, bend at the knees and slowly lower your torso toward the ground by bringing your pelvis and knees forward. Inhale as you go down and stop when your upper and lower legs almost create a 90-degree angle. Hold the stretch position for a second.", "After your one second hold, use your thigh muscles to bring your torso back up to the starting position. Exhale as you move up."]}, "x-wide-grip-barbell-bench-press": {"mus": {"p": ["chest"], "s": ["delts", "triceps"]}, "steps": ["Lie back on a flat bench with feet firm on the floor. Using a wide, pronated (palms forward) grip that is around 3 inches away from shoulder width (for each hand), lift the bar from the rack and hold it straight over you with your arms locked. The bar will be perpendicular to the torso and the floor. This will be your starting position.", "As you breathe in, come down slowly until you feel the bar on your middle chest.", "After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.", "Repeat the movement for the prescribed amount of repetitions."]}, "x-wide-grip-decline-barbell-bench-press": {"mus": {"p": ["chest"], "s": ["delts", "triceps"]}, "steps": ["Lie back on a decline bench with the feet securely locked at the front of the bench. Using a wide, pronated (palms forward) grip that is around 3 inches away from shoulder width (for each hand), lift the bar from the rack and hold it straight over you with your arms locked. The bar will be perpendicular to the torso and the floor. This will be your starting position.", "As you breathe in, come down slowly until you feel the bar on your lower chest.", "After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.", "Repeat the movement for the prescribed amount of repetitions."]}, "x-wide-grip-decline-barbell-pullover": {"mus": {"p": ["chest"], "s": ["delts", "triceps"]}, "steps": ["Lie down on a decline bench with both legs securely locked in position. Reach for the barbell behind the head using a pronated grip (palms facing out). Make sure to grab the barbell wider than shoulder width apart for this exercise. Slowly lift the barbell up from the floor by using your arms.", "When positioned properly, your arms should be fully extended and perpendicular to the floor. This is the starting position.", "Begin by moving the barbell back down in a semicircular motion as if you were going to place it on the floor, but instead, stop when the arms are parallel to the floor. Tip: Keep the arms fully extended at all times. The movement should only happen at the shoulder joint. Inhale as you perform this portion of the movement.", "Now bring the barbell up while exhaling until you are back at the starting position. Remember to keep full control of the barbell at all times.", "Repeat the movement for the prescribed amount of repetitions of your training program.", "When finished with your set, slowly lower the barbell back down until it is level with your head and release it."]}, "x-wide-grip-pulldown-behind-the-neck": {"mus": {"p": ["lats"], "s": ["biceps", "delts"]}, "steps": ["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.", "Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.", "As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso and head forward. Think of an imaginary line from the center of the bar down to the back of your neck. This is your starting position.", "As you breathe out, bring the bar down until it touches the back of your neck by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.", "After a second on the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.", "Repeat this motion for the prescribed amount of repetitions."]}, "x-wide-grip-rear-pull-up": {"mus": {"p": ["lats"], "s": ["biceps", "delts"]}, "steps": ["Grab the pull-up bar with the palms facing forward using a wide grip.", "As you have both arms extended in front of you holding the bar, bring your torso forward and head so that there is an imaginary line from the pull-up bar to the back of your neck. This is your starting position.", "Pull your torso up until the bar is near the back of your neck. To do this, draw the shoulders and upper arms down and back while slightly leaning your head forward. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.", "After a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched.", "Repeat this motion for the prescribed amount of repetitions."]}, "x-wide-grip-standing-barbell-curl": {"mus": {"p": ["biceps"], "s": []}, "steps": ["Stand up with your torso upright while holding a barbell at the wide outer handle. The palm of your hands should be facing forward. The elbows should be close to the torso. This will be your starting position.", "While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.", "Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.", "Slowly begin to bring the bar back to starting position as your breathe in."]}, "x-wide-stance-barbell-squat": {"mus": {"p": ["quads"], "s": ["calves", "glutes", "hams", "lowback"]}, "steps": ["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.", "Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.", "Step away from the rack and position your legs using a wider-than-shoulder-width stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance, and also maintain a straight back. This will be your starting position.", "Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.", "Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position."]}, "x-wind-sprints": {"mus": {"p": ["abs"], "s": []}, "steps": ["Hang from a pull-up bar using a pronated grip. Your arms and legs should be extended. This will be your starting position.", "Begin by quickly raising one knee as high as you can. Do not swing your body or your legs. 3", "Immediately reverse the motion, returning that leg to the starting position. Simultaneously raise the opposite knee as high as possible.", "Continue alternating between legs until the set is complete."]}, "x-wrist-rotations-with-straight-bar": {"mus": {"p": ["forearms"], "s": []}, "steps": ["Hold a barbell with both hands and your palms facing down; hands spaced about shoulder width. This will be your starting position.", "Alternating between each of your hands, perform the movement by extending the wrist as though you were rolling up a newspaper. Continue alternating back and forth until failure.", "Reverse the motion by flexing the wrist, rolling the opposite direction. Continue the alternating motion until failure."]}, "x-zercher-squats": {"mus": {"p": ["quads"], "s": ["calves", "glutes", "hams"]}, "steps": ["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. The correct height should be anywhere above the waist but below the chest. Once the correct height is chosen and the bar is loaded, lock your hands together and place the bar on top of your arms in between the forearm and upper arm.", "Lift the bar up so that it is resting on top of your forearms. If you are holding the bar properly, it should look as if you have your arms crossed but with a bar running across them.", "Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).", "Begin to lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.", "Begin to raise the bar as you exhale by pushing the floor with the ball of your foot mainly as you straighten the legs again and go back to the starting position."]}, "x-zottman-curl": {"mus": {"p": ["biceps"], "s": ["forearms"]}, "steps": ["Stand up with your torso upright and a dumbbell in each hand being held at arms length. The elbows should be close to the torso.", "Make sure the palms of the hands are facing each other. This will be your starting position.", "While holding the upper arm stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Your wrist should rotate so that you have a supinated (palms up) grip. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level.", "Hold the contracted position for a second as you squeeze the biceps.", "Now during the contracted position, rotate your wrist until you now have a pronated (palms facing down) grip with the thumb at a higher position than the pinky.", "Slowly begin to bring the dumbbells back down using the pronated grip."]}, "x-zottman-preacher-curl": {"mus": {"p": ["biceps"], "s": ["forearms"]}, "steps": ["Grab a dumbbell in each hand and place your upper arms on top of the preacher bench or the incline bench. The dumbbells should be held at shoulder height and the elbows should be flexed. Hold the dumbbells with the palms of your hands facing down. This will be your starting position.", "As you breathe in, slowly lower the dumbbells keeping the palms down until your upper arm is extended and your biceps are fully stretched.", "Now rotate your wrists once you are at the bottom of the movement so that the palms of the hands are facing up.", "As you exhale, use your biceps to curl the weights up until they are fully contracted and the dumbbells are at shoulder height. Again, remember that to ensure full contraction you need to bring that small finger higher than the thumb.", "Squeeze the biceps hard for a second at the contracted position and rotate your wrists so that the palms are facing down again."]}};
